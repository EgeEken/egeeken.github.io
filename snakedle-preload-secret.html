<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakedle Preload Tool</title>
    <style>
        :root {
            --bg: #0a121b;
            --panel: #102334;
            --accent: #7ddfdf;
            --text: #e8f0f0;
            --muted: #9fb8c8;
            --bad: #e06464;
            --good: #66c28f;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #17314a 0%, var(--bg) 60%);
            color: var(--text);
            font-family: "Futura", "Trebuchet MS", sans-serif;
            min-height: 100vh;
        }

        main {
            width: min(980px, 94vw);
            margin: 24px auto 40px;
            padding: 18px;
            background: rgba(16, 35, 52, 0.92);
            border: 1px solid rgba(125, 223, 223, 0.3);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 8px;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        p {
            color: var(--muted);
            margin: 8px 0;
            line-height: 1.5;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 14px 0 18px;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(140px, 1fr));
            gap: 10px;
            margin: 10px 0 4px;
        }

        .config-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .config-field label {
            color: var(--muted);
            font-size: 0.86rem;
        }

        .config-field input {
            border: 1px solid rgba(125, 223, 223, 0.35);
            border-radius: 8px;
            background: rgba(3, 10, 16, 0.75);
            color: var(--text);
            padding: 8px 10px;
            font-family: inherit;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            font-weight: 700;
        }

        #run-btn {
            background: var(--accent);
            color: #102334;
        }

        #save-btn {
            background: #2e4b61;
            color: var(--text);
        }

        #stop-btn {
            background: #6c2931;
            color: #fff;
        }

        #save-btn:disabled,
        #stop-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #summary {
            margin: 10px 0;
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(7, 20, 32, 0.75);
            border: 1px solid rgba(125, 223, 223, 0.25);
            white-space: pre-wrap;
        }

        #log {
            margin: 12px 0 0;
            height: 320px;
            overflow: auto;
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(3, 10, 16, 0.85);
            border: 1px solid rgba(125, 223, 223, 0.2);
            white-space: pre-wrap;
            font-family: Consolas, "Courier New", monospace;
            font-size: 0.86rem;
            line-height: 1.4;
        }

        .ok {
            color: var(--good);
        }

        .warn {
            color: #efc66b;
        }

        .err {
            color: var(--bad);
        }

        #hidden-frames {
            position: fixed;
            left: -10000px;
            top: -10000px;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }

        @media (max-width: 760px) {
            .config-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Snakedle Secret Preload Tool</h1>
        <p>This page is intentionally unlinked. Run this locally to benchmark day generation and prepare preload data.</p>
        <p>Set the run range and thresholds below, then generate and save.</p>

        <div class="config-grid">
            <div class="config-field">
                <label for="cfg-start-day">Start day</label>
                <input id="cfg-start-day" type="number" min="1" step="1" value="20">
            </div>
            <div class="config-field">
                <label for="cfg-end-day">End day</label>
                <input id="cfg-end-day" type="number" min="1" step="1" value="100">
            </div>
            <div class="config-field">
                <label for="cfg-preload-threshold">Preload threshold (ms)</label>
                <input id="cfg-preload-threshold" type="number" min="0" step="1" value="500">
            </div>
            <div class="config-field">
                <label for="cfg-hard-threshold">Hard threshold (ms)</label>
                <input id="cfg-hard-threshold" type="number" min="1" step="1" value="7000">
            </div>
        </div>

        <div class="controls">
            <button id="run-btn">Run Benchmark + Build JSON</button>
            <button id="save-btn" disabled>Save to preloaded_dailies.json</button>
            <button id="save-params-btn" disabled>Save to snakedle-selected-day-params.json</button>
            <button id="stop-btn" disabled>Stop</button>
        </div>

        <div id="summary">Idle.</div>
        <div id="log"></div>
    </main>

    <div id="hidden-frames"></div>

    <script>
        const DEFAULT_START_DAY = 20;
        const DEFAULT_END_DAY = 100;
        const DEFAULT_SLOW_THRESHOLD_MS = 500;
        const DEFAULT_HARD_THRESHOLD_MS = 7000;
        const TIMEOUT_MS = 120000;
        const DAILY_PARAMETER_LIMITS = {
            mapSize: { min: 7, max: 10 },
            fruitCount: { min: 8, max: 13 },
            wallCount: { min: 10, max: 30 }
        };

        const runBtn = document.getElementById('run-btn');
        const saveBtn = document.getElementById('save-btn');
        const saveParamsBtn = document.getElementById('save-params-btn');
        const stopBtn = document.getElementById('stop-btn');
        const summaryEl = document.getElementById('summary');
        const logEl = document.getElementById('log');
        const hiddenFramesEl = document.getElementById('hidden-frames');
        const startDayInput = document.getElementById('cfg-start-day');
        const endDayInput = document.getElementById('cfg-end-day');
        const preloadThresholdInput = document.getElementById('cfg-preload-threshold');
        const hardThresholdInput = document.getElementById('cfg-hard-threshold');

        let shouldStop = false;
        let latestPayload = null;
        let latestSelectedParamsPayload = null;

        function appendLog(message, kind = '') {
            const stamp = new Date().toLocaleTimeString();
            const line = `[${stamp}] ${message}`;
            const div = document.createElement('div');
            if (kind) {
                div.className = kind;
            }
            div.textContent = line;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function setSummary(text) {
            summaryEl.textContent = text;
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function parsePositiveIntInput(inputEl, fallback) {
            const raw = Number(inputEl.value);
            if (!Number.isFinite(raw)) {
                inputEl.value = String(fallback);
                return fallback;
            }

            const value = Math.max(1, Math.floor(raw));
            inputEl.value = String(value);
            return value;
        }

        function parseNonNegativeIntInput(inputEl, fallback) {
            const raw = Number(inputEl.value);
            if (!Number.isFinite(raw)) {
                inputEl.value = String(fallback);
                return fallback;
            }

            const value = Math.max(0, Math.floor(raw));
            inputEl.value = String(value);
            return value;
        }

        function areSameParams(a, b) {
            return a.mapSize === b.mapSize && a.fruitCount === b.fruitCount && a.wallCount === b.wallCount;
        }

        function isValidParameterSet(mapSize, fruitCount, wallCount) {
            if (mapSize < DAILY_PARAMETER_LIMITS.mapSize.min || mapSize > DAILY_PARAMETER_LIMITS.mapSize.max) {
                return false;
            }
            if (fruitCount < DAILY_PARAMETER_LIMITS.fruitCount.min || fruitCount > DAILY_PARAMETER_LIMITS.fruitCount.max) {
                return false;
            }
            if (wallCount < DAILY_PARAMETER_LIMITS.wallCount.min || wallCount > DAILY_PARAMETER_LIMITS.wallCount.max) {
                return false;
            }
            if (mapSize + fruitCount > 20) {
                return false;
            }
            return fruitCount + wallCount <= (mapSize * mapSize) / 2;
        }

        function getAllConstrainedParameterSets() {
            const sets = [];
            for (let mapSize = DAILY_PARAMETER_LIMITS.mapSize.min; mapSize <= DAILY_PARAMETER_LIMITS.mapSize.max; mapSize++) {
                for (let fruitCount = DAILY_PARAMETER_LIMITS.fruitCount.min; fruitCount <= DAILY_PARAMETER_LIMITS.fruitCount.max; fruitCount++) {
                    for (let wallCount = DAILY_PARAMETER_LIMITS.wallCount.min; wallCount <= DAILY_PARAMETER_LIMITS.wallCount.max; wallCount++) {
                        if (!isValidParameterSet(mapSize, fruitCount, wallCount)) {
                            continue;
                        }
                        sets.push({ mapSize, fruitCount, wallCount });
                    }
                }
            }
            return sets;
        }

        function mulberry32(seed) {
            let t = seed >>> 0;
            return function () {
                t += 0x6D2B79F5;
                let r = Math.imul(t ^ (t >>> 15), 1 | t);
                r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
                return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
            };
        }

        function pickConstrainedParameters(seed) {
            const sets = getAllConstrainedParameterSets();
            if (sets.length === 0) {
                throw new Error('No valid parameter sets found for configured limits.');
            }
            const rng = mulberry32((seed * 1013904223) >>> 0);
            return sets[Math.floor(rng() * sets.length)];
        }

        function normalizeSelectedDayParams(raw) {
            const source = raw && typeof raw === 'object' && raw.snakedle && typeof raw.snakedle === 'object'
                ? raw.snakedle
                : raw;
            const normalized = {};
            if (!source || typeof source !== 'object') {
                return normalized;
            }

            Object.entries(source).forEach(([dayKey, params]) => {
                const day = Number(dayKey);
                if (!Number.isInteger(day) || day < 1 || !params || typeof params !== 'object') {
                    return;
                }
                const mapSize = Number(params.mapSize);
                const fruitCount = Number(params.fruitCount);
                const wallCount = Number(params.wallCount);
                if (!Number.isFinite(mapSize) || !Number.isFinite(fruitCount) || !Number.isFinite(wallCount)) {
                    return;
                }
                if (!isValidParameterSet(mapSize, fruitCount, wallCount)) {
                    return;
                }
                normalized[day] = { mapSize, fruitCount, wallCount };
            });

            return normalized;
        }

        function resolveParamsForDay(day, selectedByDay) {
            if (selectedByDay[day]) {
                return {
                    mapSize: selectedByDay[day].mapSize,
                    fruitCount: selectedByDay[day].fruitCount,
                    wallCount: selectedByDay[day].wallCount
                };
            }
            return pickConstrainedParameters(day);
        }

        async function loadExistingPreloadedJson() {
            const response = await fetch('assets/preloaded_dailies.json', { cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`Failed to load assets/preloaded_dailies.json (${response.status})`);
            }
            const data = await response.json();
            if (!data || typeof data !== 'object') {
                throw new Error('preloaded_dailies.json did not return an object.');
            }
            if (!data.snakedle || typeof data.snakedle !== 'object') {
                data.snakedle = {};
            }
            if (!data.invertedSnakedle || typeof data.invertedSnakedle !== 'object') {
                data.invertedSnakedle = {};
            }
            return data;
        }

        async function loadSelectedDayParamsData() {
            const response = await fetch('assets/snakedle-selected-day-params.json', { cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`Failed to load assets/snakedle-selected-day-params.json (${response.status})`);
            }
            const data = await response.json();
            const safeData = data && typeof data === 'object' ? data : {};
            if (!safeData.snakedle || typeof safeData.snakedle !== 'object') {
                safeData.snakedle = {};
            }

            return {
                raw: safeData,
                normalized: normalizeSelectedDayParams(safeData)
            };
        }

        function cleanupFrame(frame) {
            if (frame && frame.parentNode) {
                frame.parentNode.removeChild(frame);
            }
        }

        function serializeSnakedle(day, snapshot) {
            if (!snapshot || !snapshot.puzzle) {
                throw new Error(`Missing snakedle snapshot for day ${day}.`);
            }
            return {
                dayNumber: day,
                mapState: {
                    snakeStart: (snapshot.puzzle.snakeStart || []).map(segment => ({ x: Number(segment.x), y: Number(segment.y) })),
                    fruits: (snapshot.puzzle.fruits || []).map(fruit => ({ x: Number(fruit.x), y: Number(fruit.y) })),
                    walls: (snapshot.puzzle.walls || []).map(wall => ({ x: Number(wall.x), y: Number(wall.y) }))
                },
                optimalMoves: {
                    count: Number(snapshot.puzzle.optimalMoves && snapshot.puzzle.optimalMoves.count)
                }
            };
        }

        function serializeInverted(day, snapshot) {
            if (!snapshot) {
                throw new Error(`Missing inverted snapshot for day ${day}.`);
            }
            return {
                dayNumber: day,
                moveLimit: Number(snapshot.moveLimit),
                maxCollectableFruits: Number(snapshot.maxCollectableFruits)
            };
        }

        function waitForFrameLoad(frame) {
            return new Promise((resolve, reject) => {
                const onLoad = () => {
                    frame.removeEventListener('load', onLoad);
                    resolve();
                };
                const onError = () => {
                    frame.removeEventListener('error', onError);
                    reject(new Error('Frame failed to load.'));
                };
                frame.addEventListener('load', onLoad, { once: true });
                frame.addEventListener('error', onError, { once: true });
            });
        }

        function waitForDebugSnapshot(frameWindow, hookName, timeoutMs) {
            return new Promise((resolve, reject) => {
                const startedAt = performance.now();

                const tick = () => {
                    try {
                        const hook = frameWindow[hookName];
                        if (hook && typeof hook.waitUntilReady === 'function') {
                            hook.waitUntilReady().then(resolve).catch(reject);
                            return;
                        }
                    } catch (err) {
                        reject(err);
                        return;
                    }

                    if (performance.now() - startedAt > timeoutMs) {
                        reject(new Error(`Timed out waiting for ${hookName}.`));
                        return;
                    }

                    setTimeout(tick, 30);
                };

                tick();
            });
        }

        async function runProbe(pagePath, hookName, day, params) {
            const frame = document.createElement('iframe');
            frame.setAttribute('sandbox', 'allow-scripts allow-same-origin');

            const queryParams = new URLSearchParams();
            queryParams.set('preloadTool', '1');
            queryParams.set('mapSize', String(params.mapSize));
            queryParams.set('fruitCount', String(params.fruitCount));
            queryParams.set('wallCount', String(params.wallCount));

            const src = `${pagePath}?${queryParams.toString()}#admin-${day}`;
            const startedAt = performance.now();
            hiddenFramesEl.appendChild(frame);

            try {
                frame.src = src;
                await waitForFrameLoad(frame);
                const snapshot = await waitForDebugSnapshot(frame.contentWindow, hookName, TIMEOUT_MS);
                const elapsed = performance.now() - startedAt;
                return { snapshot, elapsed };
            } finally {
                cleanupFrame(frame);
            }
        }

        function compactCoordinateObjects(jsonText) {
            return jsonText.replace(
                /(^\s*)\{\n(\s*)"x":\s*(-?\d+),\n\2"y":\s*(-?\d+)\n\1\}/gm,
                '$1{ "x": $3, "y": $4 }'
            );
        }

        function formatJsonWithCompactPoints(value) {
            const pretty = JSON.stringify(value, null, 2);
            return compactCoordinateObjects(pretty) + '\n';
        }

        async function savePayloadToJson(payloadText, defaultName) {
            if ('showOpenFilePicker' in window) {
                const [fileHandle] = await window.showOpenFilePicker({
                    multiple: false,
                    types: [
                        {
                            description: 'JSON files',
                            accept: { 'application/json': ['.json'] }
                        }
                    ]
                });
                const writable = await fileHandle.createWritable();
                await writable.write(payloadText);
                await writable.close();
                return;
            }

            const blob = new Blob([payloadText], { type: 'application/json' });
            const downloadUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = defaultName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(downloadUrl);
        }

        async function runGeneration() {
            const startDay = parsePositiveIntInput(startDayInput, DEFAULT_START_DAY);
            const endDayRaw = parsePositiveIntInput(endDayInput, DEFAULT_END_DAY);
            const endDay = Math.max(startDay, endDayRaw);
            endDayInput.value = String(endDay);
            const slowThresholdMs = parseNonNegativeIntInput(preloadThresholdInput, DEFAULT_SLOW_THRESHOLD_MS);
            const hardThresholdMs = parsePositiveIntInput(hardThresholdInput, DEFAULT_HARD_THRESHOLD_MS);

            shouldStop = false;
            latestPayload = null;
            latestSelectedParamsPayload = null;
            saveBtn.disabled = true;
            saveParamsBtn.disabled = true;
            runBtn.disabled = true;
            stopBtn.disabled = false;
            logEl.innerHTML = '';

            appendLog('Loading existing preload and selected-params files...');
            const preloadedData = await loadExistingPreloadedJson();
            const selectedParamsData = await loadSelectedDayParamsData();

            let processed = 0;
            let preloadedDays = 0;
            let adjustedDays = 0;

            for (let day = startDay; day <= endDay; day++) {
                if (shouldStop) {
                    appendLog('Run stopped by user.', 'warn');
                    break;
                }

                processed += 1;
                setSummary(`Processing day ${day} (${processed}/${endDay - startDay + 1})...`);

                const baseParams = resolveParamsForDay(day, selectedParamsData.normalized);
                const defaultParams = pickConstrainedParameters(day);
                let chosenParams = {
                    mapSize: baseParams.mapSize,
                    fruitCount: baseParams.fruitCount,
                    wallCount: baseParams.wallCount
                };

                let snakedleResult = null;
                while (true) {
                    appendLog(`Day ${day}: probing Snakedle with map=${chosenParams.mapSize}, fruit=${chosenParams.fruitCount}, wall=${chosenParams.wallCount}...`);
                    snakedleResult = await runProbe('snakedle.html', '__snakedleDebug', day, chosenParams);
                    appendLog(`Day ${day}: Snakedle ready in ${snakedleResult.elapsed.toFixed(1)}ms.`);

                    if (snakedleResult.elapsed <= hardThresholdMs) {
                        break;
                    }

                    const nextFruit = chosenParams.fruitCount - 1;
                    if (!isValidParameterSet(chosenParams.mapSize, nextFruit, chosenParams.wallCount)) {
                        appendLog(`Day ${day}: still over ${hardThresholdMs}ms but fruit cannot be reduced further.`, 'warn');
                        break;
                    }

                    chosenParams.fruitCount = clamp(nextFruit, DAILY_PARAMETER_LIMITS.fruitCount.min, DAILY_PARAMETER_LIMITS.fruitCount.max);
                    adjustedDays += 1;
                    appendLog(`Day ${day}: exceeded ${hardThresholdMs}ms, retrying with fruit=${chosenParams.fruitCount}.`, 'warn');
                }

                if (!snakedleResult) {
                    continue;
                }

                const shouldPreload = snakedleResult.elapsed > slowThresholdMs;
                if (areSameParams(chosenParams, defaultParams)) {
                    delete selectedParamsData.raw.snakedle[String(day)];
                    delete selectedParamsData.normalized[day];
                } else {
                    selectedParamsData.raw.snakedle[String(day)] = {
                        mapSize: chosenParams.mapSize,
                        fruitCount: chosenParams.fruitCount,
                        wallCount: chosenParams.wallCount
                    };
                    selectedParamsData.normalized[day] = { ...chosenParams };
                }

                if (!shouldPreload) {
                    appendLog(`Day ${day}: under preload threshold (${slowThresholdMs}ms), skipped preload payload.`, 'ok');
                    continue;
                }

                preloadedData.snakedle[String(day)] = serializeSnakedle(day, snakedleResult.snapshot);

                appendLog(`Day ${day}: collecting Inverted metadata (timing not used for threshold)...`);
                const invertedResult = await runProbe('inverted-snakedle.html', '__invertedSnakedleDebug', day, chosenParams);
                preloadedData.invertedSnakedle[String(day)] = serializeInverted(day, invertedResult.snapshot);

                preloadedDays += 1;
                appendLog(`Day ${day}: preload entries generated.`, 'warn');
            }

            latestPayload = formatJsonWithCompactPoints(preloadedData);
            latestSelectedParamsPayload = formatJsonWithCompactPoints(selectedParamsData.raw);

            setSummary(
                `Completed. Processed ${processed} days. Generated preload entries for ${preloadedDays} day(s).\n` +
                `Adjusted day parameters for ${adjustedDays} iteration(s) based on the ${hardThresholdMs}ms rule.\n` +
                `Save both JSON files to keep runtime and preload data in sync.`
            );

            saveBtn.disabled = !latestPayload;
            saveParamsBtn.disabled = !latestSelectedParamsPayload;
            stopBtn.disabled = true;
            runBtn.disabled = false;
        }

        runBtn.addEventListener('click', async () => {
            try {
                await runGeneration();
            } catch (error) {
                appendLog(`Error: ${error.message}`, 'err');
                setSummary('Run failed. Check the log for details.');
                stopBtn.disabled = true;
                runBtn.disabled = false;
            }
        });

        stopBtn.addEventListener('click', () => {
            shouldStop = true;
            stopBtn.disabled = true;
        });

        saveBtn.addEventListener('click', async () => {
            if (!latestPayload) {
                return;
            }

            try {
                await savePayloadToJson(latestPayload, 'preloaded_dailies.json');
                appendLog('Saved preloaded_dailies.json successfully.', 'ok');
            } catch (error) {
                appendLog(`Save failed: ${error.message}`, 'err');
            }
        });

        saveParamsBtn.addEventListener('click', async () => {
            if (!latestSelectedParamsPayload) {
                return;
            }

            try {
                await savePayloadToJson(latestSelectedParamsPayload, 'snakedle-selected-day-params.json');
                appendLog('Saved snakedle-selected-day-params.json successfully.', 'ok');
            } catch (error) {
                appendLog(`Save failed: ${error.message}`, 'err');
            }
        });
    </script>
</body>

</html>
