<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Ege - Snakedle</title>
    <style>
        :root {
            --snakedle-grid-size: 6;
        }

        #snakedle-wrapper {
            width: min(980px, 96%);
            margin: 20px auto 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            color: #eee;
        }

        .snakedle-stat {
            font-family: 'Futura', sans-serif;
            letter-spacing: 1px;
            text-align: center;
            font-size: 1.1em;
        }

        .snakedle-stat#daily-label {
            font-size: 1.3em;
            font-weight: 700;
            color: #7ddfdf;
        }

        #snakedle-layout {
            width: 100%;
            display: grid;
            grid-template-columns: minmax(235px, 235px) minmax(280px, 1fr) minmax(235px, 235px);
            gap: 150px;
            align-items: center;
        }

        .snakedle-panel {
            background: rgba(12, 32, 48, 0.72);
            border: 1px solid rgba(125, 223, 223, 0.25);
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 0 15px rgba(12, 32, 48, 0.35);
        }

        #snakedle-board-wrap {
            position: relative;
            display: flex;
            justify-content: center;
        }

        #generation-overlay {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(5, 12, 20, 0.62);
            backdrop-filter: blur(4px);
            border-radius: 10px;
            z-index: 20;
            color: #fff;
            font-family: 'Futura', sans-serif;
            letter-spacing: 0.6px;
            text-align: center;
            pointer-events: all;
        }

        .loading-spinner {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.35);
            border-top-color: #fff;
            border-right-color: transparent;
            animation: snakedle-spin 0.9s linear infinite;
        }

        #generation-progress {
            font-size: 0.9em;
            opacity: 0.9;
        }

        @keyframes snakedle-spin {
            to {
                transform: rotate(360deg);
            }
        }

        #snakedle-canvas {
            width: min(94vw, 672px);
            height: auto;
            border: 3px solid #126364;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(18, 99, 100, 0.5);
            background-color: #0c2030;
        }

        #dpad-snakedle {
            display: grid;
            gap: 8px;
            justify-items: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .dpad-row {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .snakedle-btn {
            width: clamp(46px, 7vw, 58px);
            height: clamp(46px, 7vw, 58px);
            border: none;
            border-radius: 8px;
            background-color: #126364;
            color: #eee;
            font-size: clamp(1.05em, 1.8vw, 1.25em);
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 0 8px rgba(18, 99, 100, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 1;
            font-weight: 700;
        }

        .snakedle-btn:active {
            transform: scale(0.95);
            background-color: #0d4f50;
        }

        .snakedle-btn.alt {
            width: calc(50% - 6px);
            font-size: 0.9em;
            height: 42px;
            margin-top: 6px;
        }

        #move-grid {
            display: grid;
            grid-template-columns: repeat(var(--snakedle-grid-size), minmax(0, 1fr));
            gap: clamp(2px, 0.6vw, 5px);
            margin-top: 6px;
            margin-bottom: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .move-cell {
            aspect-ratio: 1;
            min-width: 0;
            border-radius: 6px;
            border: 1px solid rgba(187, 221, 221, 0.35);
            background: rgba(12, 32, 48, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cbe4e4;
            font-size: var(--snakedle-move-icon-size, 1.1em);
            font-family: 'Futura', sans-serif;
            overflow: hidden;
            line-height: 1;
            font-weight: 700;
        }

        .move-cell.filled {
            background: rgba(18, 99, 100, 0.85);
            color: #fff;
            border-color: rgba(125, 223, 223, 0.8);
        }

        .move-cell.crash {
            background: rgba(224, 85, 85, 0.78);
            border-color: rgba(255, 170, 170, 0.9);
            color: #fff;
        }

        #submit-snakedle {
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            background-color: #7ddfdf;
            color: #102334;
            font-family: 'Futura', sans-serif;
            font-size: 1em;
            cursor: pointer;
            font-weight: 700;
            transition: transform 0.15s, background-color 0.25s;
        }

        #submit-snakedle:hover {
            transform: scale(1.02);
            background-color: #a7eded;
        }

        #status-line {
            margin-top: 8px;
            color: #bbd;
            min-height: 22px;
            text-align: center;
            font-size: 0.92em;
        }

        #results-modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(8, 15, 24, 0.78);
            z-index: 1200;
        }

        #results-card {
            width: min(92vw, 460px);
            background: #102334;
            border: 2px solid #126364;
            border-radius: 12px;
            padding: 18px;
            color: #eee;
            text-align: center;
            box-shadow: 0 0 30px rgba(8, 15, 24, 0.7);
        }

        #results-text {
            white-space: pre-wrap;
            text-align: left;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0 14px;
        }

        .results-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .results-actions button {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-family: 'Futura', sans-serif;
            cursor: pointer;
        }

        #copy-share {
            background: #7ddfdf;
            color: #102334;
            font-weight: 700;
        }

        #close-results {
            background: #2e4b61;
            color: #e8f0f0;
        }

        .link-to-inverted {
            display: flex;
            margin-top: 14px;
            gap: 10px;
            justify-content: center;
        }
        
        .link-to-inverted button {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-family: 'Futura', sans-serif;
            cursor: pointer;
        }

        #link-inverted {
            background: rgb(78, 6, 6);
            color: #fff;
            font-weight: 700;
        }

        @media (max-width: 1000px) {
            #snakedle-layout {
                grid-template-columns: 1fr;
                row-gap: 50px;
                column-gap: 150px;
            }

            #snakedle-board-wrap {
                order: -1;
            }
        }

        @media (max-width: 480px) {
            .snakedle-btn {
                width: 52px;
                height: 52px;
            }
        }

        header h1 {
            margin-top: 3% !important;
            transition: margin-top 0.3s ease;
        }

        @media screen and (max-width: 700px) {
            header h1 {
                margin-top: 16% !important;
            }
        }

        .tutorial-button {
			width: min(360px, 92vw);
			padding: 12px 16px;
			border: none;
			border-radius: 10px;
			background-color: #7ddfdf;
			color: #102334;
			font-family: 'Futura', sans-serif;
			font-size: 1.05em;
			font-weight: 700;
			letter-spacing: 0.6px;
			cursor: pointer;
			transition: transform 0.15s, background-color 0.25s;
			text-decoration: none;
			text-align: center;
			box-shadow: 0 0 14px rgba(125, 223, 223, 0.38);
		}

		.tutorial-button:hover {
			transform: scale(1.02);
			background-color: #a7eded;
		}
    </style>
</head>

<body>
    <header>
        <a href="/games/snakedle/" class="back-button">← Return to Menu</a>
        <h1><b>Snakedle</b></h1>
        <h2><a class="tutorial-button" href="games/snakedle/snakedle-tutorial.html">Tutorial</a></h2>
        
    </header>

    <main id="snakedle-wrapper">
        <div class="snakedle-panel">
            <div class="snakedle-stat" id="daily-label">Snakedle Day --</div>
            <div class="snakedle-stat" id="fruit-progress">Fruits: 0 / --</div>
            <div class="snakedle-stat" id="move-progress">Moves: 0 / --</div>
        </div>

        <section id="snakedle-layout">
            <div class="snakedle-panel">
                <div id="dpad-snakedle">
                    <button class="snakedle-btn" data-dir="U" aria-label="Up">▴</button>
                    <div class="dpad-row">
                        <button class="snakedle-btn" data-dir="L" aria-label="Left">◂</button>
                        <button class="snakedle-btn" data-dir="D" aria-label="Down">▾</button>
                        <button class="snakedle-btn" data-dir="R" aria-label="Right">▸</button>
                    </div>
                    <div class="dpad-row" style="width:100%;">
                        <button class="snakedle-btn alt" id="undo-move">Undo</button>
                        <button class="snakedle-btn alt" id="clear-moves">Clear</button>
                    </div>
                </div>
                <div id="status-line">Use the buttons or arrow keys to queue moves.</div>
            </div>

            <div id="snakedle-board-wrap">
                <canvas id="snakedle-canvas" width="420" height="420"></canvas>
                <div id="generation-overlay" aria-live="polite" aria-busy="true">
                    <div class="loading-spinner" aria-hidden="true"></div>
                    <div id="generation-message">Generating map...</div>
                    <div id="generation-progress">Attempts: 0 / 0</div>
                </div>
            </div>

            <div class="snakedle-panel">
                <div style="text-align:center; margin-bottom:4px;">Move Queue</div>
                <div id="move-grid"></div>
                <button id="submit-snakedle">Submit run</button>
            </div>
        </section>
    </main>

    <div id="results-modal" role="dialog" aria-modal="true">
        <div id="results-card">
            <h3>Result</h3>
            <div id="results-text"></div>
            <div class="results-actions">
                <button id="copy-share">Copy Share Text</button>
                <button id="close-results">Close</button>
            </div>
            <div class="link-to-inverted">
                <button id="link-inverted" onclick="window.location.href='inverted-snakedle.html'">Try the new Inverted version!</button>
            </div>
        </div>
    </div>

    <script>
        const DAILY_PARAMETER_LIMITS = {
            mapSize: { min: 7, max: 10 },
            fruitCount: { min: 8, max: 13 },
            wallCount: { min: 10, max: 30 }
        };
        
        const SELECTED_DAY_PARAMS = {
            4: {mapSize: 8, fruitCount: 12, wallCount: 20},
            5: {mapSize: 9, fruitCount: 10, wallCount: 30},
            7: {mapSize: 8, fruitCount: 12, wallCount: 20},
        };

        const LAUNCH_DAY_UTC = Date.UTC(2026, 2, 19); // March 19, 2026
        const dayNumber = getDayNumber(new Date());
        const dailyParameters = pickConstrainedParameters(dayNumber, DAILY_PARAMETER_LIMITS, SELECTED_DAY_PARAMS);
        const GRID_SIZE = dailyParameters.mapSize;
        const CELL_SIZE = 420 / GRID_SIZE;
        const FRUIT_COUNT = dailyParameters.fruitCount;
        const WALL_COUNT = dailyParameters.wallCount;
        const MAX_MOVES = GRID_SIZE * GRID_SIZE;
        const MAX_GEN_ATTEMPTS = 10000;
        const MAX_GEN_TIME_MS = 3000;
        const GENERATION_PROGRESS_UPDATE_EVERY = 8;

        const DIRS = {
            U: { x: 0, y: -1 },
            D: { x: 0, y: 1 },
            L: { x: -1, y: 0 },
            R: { x: 1, y: 0 }
        };
        const DIR_ORDER = ['U', 'R', 'D', 'L'];
        const ARROW = { U: '▴', D: '▾', L: '◂', R: '▸' };
        const MOVE_ICON_MIN_SIZE_EM = 0.7;
        const MOVE_ICON_BASE_SIZE_EM = 1.2;
        const MOVE_ICON_REFERENCE_GRID_SIZE = 6;
        const MOVE_ICON_SIZE_STEP_EM = 0.13;

        const canvas = document.getElementById('snakedle-canvas');
        const ctx = canvas.getContext('2d');
        const fruitProgressEl = document.getElementById('fruit-progress');
        const moveProgressEl = document.getElementById('move-progress');
        const dailyLabelEl = document.getElementById('daily-label');
        const moveGridEl = document.getElementById('move-grid');
        const statusLineEl = document.getElementById('status-line');
        const resultsModal = document.getElementById('results-modal');
        const resultsTextEl = document.getElementById('results-text');
        const generationOverlayEl = document.getElementById('generation-overlay');
        const generationMessageEl = document.getElementById('generation-message');
        const generationProgressEl = document.getElementById('generation-progress');

        const queueMoves = [];
        const moveCells = [];
        const OPPOSITE = { U: 'D', D: 'U', L: 'R', R: 'L' };
        const FRAME_DURATION_MS = 120;
        const AUTO_SUBMIT_DELAY_MS = 120;

        dailyLabelEl.textContent = `Snakedle Day ${dayNumber}`;
        document.documentElement.style.setProperty('--snakedle-grid-size', String(GRID_SIZE));
        document.documentElement.style.setProperty(
            '--snakedle-move-icon-size',
            `${Math.max(
                MOVE_ICON_MIN_SIZE_EM,
                MOVE_ICON_BASE_SIZE_EM - (GRID_SIZE - MOVE_ICON_REFERENCE_GRID_SIZE) * MOVE_ICON_SIZE_STEP_EM
            )}em`
        );

        let puzzle = null;
        let optimalMoves = { count: Infinity, moves: [] };

        let playbackFrames = [];
        let playbackTimer = null;
        let autoSubmitTimer = null;
        let isSubmitting = false;
        let isGeneratingPuzzle = false;

        function setGenerationOverlay(active, attempt = 0, reason = 'Generating map...') {
            generationOverlayEl.style.display = active ? 'flex' : 'none';
            generationMessageEl.textContent = reason;
            generationProgressEl.textContent = `Attempts: ${attempt} / ${MAX_GEN_ATTEMPTS}`;
        }

        function setControlsDisabled(disabled) {
            document.querySelectorAll('[data-dir]').forEach(btn => {
                btn.disabled = disabled;
            });
            document.getElementById('submit-snakedle').disabled = disabled;
            undoButton.disabled = disabled;
            clearButton.disabled = disabled;
        }

        function yieldToUi() {
            return new Promise(resolve => setTimeout(resolve, 0));
        }

        async function initializeGame() {
            isGeneratingPuzzle = true;
            setControlsDisabled(true);
            setGenerationOverlay(true, 0, 'Generating daily map...');
            try {
                puzzle = await generateDailyPuzzle(dayNumber);
                optimalMoves = puzzle.optimalMoves;
            } finally {
                isGeneratingPuzzle = false;
                setGenerationOverlay(false, 0, 'Generating daily map...');
                setControlsDisabled(false);
            }

            refreshMoveGrid();
            refreshPlayback();
        }

        for (let i = 0; i < MAX_MOVES; i++) {
            const cell = document.createElement('div');
            cell.className = 'move-cell';
            moveGridEl.appendChild(cell);
            moveCells.push(cell);
        }

        function getDayNumber(date) {
            // Convert the current date to Paris time
            const parisTime = new Date(date.toLocaleString('en-US', { timeZone: 'Europe/Paris' }));
            const todayParis = Date.UTC(parisTime.getFullYear(), parisTime.getMonth(), parisTime.getDate());
            return Math.max(1, Math.floor((todayParis - LAUNCH_DAY_UTC) / 86400000) + 1);
        }

        function isValidParameterSet(mapSize, fruitCount, wallCount) {
            if (mapSize < 7 || mapSize > 10) {
                return false;
            }
            if (fruitCount < 8 || fruitCount > 13) {
                return false;
            }
            if (wallCount < 10 || wallCount > 30) {
                return false;
            }
            if (mapSize + fruitCount > 20) {
                return false;
            }
            return fruitCount + wallCount <= (mapSize * mapSize) / 2;
        }

        function getAllConstrainedParameterSets(limits) {
            const sets = [];
            for (let mapSize = limits.mapSize.min; mapSize <= limits.mapSize.max; mapSize++) {
                for (let fruitCount = limits.fruitCount.min; fruitCount <= limits.fruitCount.max; fruitCount++) {
                    for (let wallCount = limits.wallCount.min; wallCount <= limits.wallCount.max; wallCount++) {
                        if (!isValidParameterSet(mapSize, fruitCount, wallCount)) {
                            continue;
                        }

                        sets.push({ mapSize, fruitCount, wallCount });
                    }
                }
            }

            return sets;
        }

        function pickConstrainedParameters(seed, limits) {
            if (SELECTED_DAY_PARAMS[seed]) {
                const params = SELECTED_DAY_PARAMS[seed];
                if (isValidParameterSet(params.mapSize, params.fruitCount, params.wallCount)) {
                    return params;
                } else {
                    console.warn(`Selected parameters for day ${seed} are invalid. Falling back to random selection.`);
                }
            }
            const sets = getAllConstrainedParameterSets(limits);
            if (sets.length === 0) {
                throw new Error('No valid parameter sets found for the provided limits.');
            }

            const rng = mulberry32((seed * 1013904223) >>> 0);
            return sets[Math.floor(rng() * sets.length)];
        }

        function mulberry32(seed) {
            let t = seed >>> 0;
            return function () {
                t += 0x6D2B79F5;
                let r = Math.imul(t ^ (t >>> 15), 1 | t);
                r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
                return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
            };
        }

        function cellKey(x, y) {
            return `${x},${y}`;
        }

        function parseKey(key) {
            const [x, y] = key.split(',').map(Number);
            return { x, y };
        }

        function inBounds(x, y) {
            return x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE;
        }

        function pickRandom(list, rng) {
            return list[Math.floor(rng() * list.length)];
        }

        function shuffled(list, rng) {
            const arr = list.slice();
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(rng() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        async function generateDailyPuzzle(day) {
            const baseSeed = day * 2654435761;
            const allCells = [];
            const generationStartMs = performance.now();
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    allCells.push(cellKey(x, y));
                }
            }
            const rng = mulberry32((baseSeed * 1013904223) >>> 0);
            // Place snake, it doesn't matter where as long as the head and tail are adjacent and the map is empty
            const headKey = pickRandom(allCells, rng);
            const head = parseKey(headKey);
            const neighbors = DIR_ORDER
            .map(d => ({ x: head.x + DIRS[d].x, y: head.y + DIRS[d].y }))
            .filter(c => inBounds(c.x, c.y));
            const tail = pickRandom(neighbors, rng);
            const snakeStartKeys = new Set([headKey, cellKey(tail.x, tail.y)]);
            
            // Generate fruits, they also don't matter, just have to be on the non-snake cells
            const openCells = allCells.filter(k => !snakeStartKeys.has(k));
            const fruitPool = shuffled(openCells, rng);
            const fruits = fruitPool.slice(0, FRUIT_COUNT).map(parseKey);
            
            // Generate walls, these do matter, we want to make sure the puzzle is possible, so we will generate candidates until one is possible
            for (let attempt = 0; attempt < MAX_GEN_ATTEMPTS; attempt++) {
                const attemptNumber = attempt + 1;
                if (attempt % GENERATION_PROGRESS_UPDATE_EVERY === 0) {
                    setGenerationOverlay(true, attemptNumber, 'Generating daily map...');
                    await yieldToUi();
                }
                if (performance.now() - generationStartMs > MAX_GEN_TIME_MS) {
                    console.warn(`Daily generation timeout after ${MAX_GEN_TIME_MS}ms at attempt ${attemptNumber}. Falling back.`);
                    break;
                }
                const rng = mulberry32(((baseSeed + attempt) * 1013904223) >>> 0);
                const openCells = allCells.filter(k => {
                    if (snakeStartKeys.has(k)) {
                        return false;
                    }
                    for (const fruit of fruits) {
                        if (cellKey(fruit.x, fruit.y) === k) {
                            return false;
                        }
                    }
                    return true;
                });
                const wallSet = new Set(shuffled(openCells, rng).slice(0, WALL_COUNT));

                const candidate = {
                    walls: wallSet,
                    fruits,
                    snakeStart: [head, tail]
                };
                const optimal = findOptimalMoves(candidate);
                if (Number.isFinite(optimal.count) && optimal.count <= MAX_MOVES) {
                    return { ...candidate, optimalMoves: optimal };
                }
            }

            // Fallback in the extremely unlikely case that we fail to generate a valid puzzle after 450 attempts, return a hardcoded puzzle for the given parameters. This should never happen, especially for the default parameters, as they are very easy to generate valid puzzles for, but it's here just in case. Map is a frowning face with the fruits and no walls.
            const fallback_candidate = {
                walls: new Set(),
                fruits: [{ x: 1, y: 1 }, { x: 4, y: 1 }, //eyes
                         { x: 1, y: 4 }, { x: 2, y: 3 }, { x: 3, y: 3 }, { x: 4, y: 4 }], // mouth
                snakeStart: [{ x: 0, y: 1 }, { x: 0, y: 0 }],
            }
            setGenerationOverlay(true, MAX_GEN_ATTEMPTS, 'Using fallback map...');
            await yieldToUi();
            const fallback_optimal = findOptimalMoves(fallback_candidate);
            return {
                ...fallback_candidate,
                optimalMoves: fallback_optimal
            };
        }

        function findOptimalMoves(candidate) {
            const totalCells = GRID_SIZE * GRID_SIZE;
            const wallBlocked = new Uint8Array(totalCells);
            for (const wallKey of candidate.walls) {
                const wall = parseKey(wallKey);
                wallBlocked[wall.y * GRID_SIZE + wall.x] = 1;
            }

            const fruitAtCell = new Int16Array(totalCells);
            fruitAtCell.fill(-1);
            candidate.fruits.forEach((fruit, i) => {
                fruitAtCell[fruit.y * GRID_SIZE + fruit.x] = i;
            });

            const targetMask = (1 << candidate.fruits.length) - 1;

            const nextUp = new Int16Array(totalCells);
            const nextRight = new Int16Array(totalCells);
            const nextDown = new Int16Array(totalCells);
            const nextLeft = new Int16Array(totalCells);
            nextUp.fill(-1);
            nextRight.fill(-1);
            nextDown.fill(-1);
            nextLeft.fill(-1);

            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const idx = y * GRID_SIZE + x;
                    if (y > 0) nextUp[idx] = idx - GRID_SIZE;
                    if (x < GRID_SIZE - 1) nextRight[idx] = idx + 1;
                    if (y < GRID_SIZE - 1) nextDown[idx] = idx + GRID_SIZE;
                    if (x > 0) nextLeft[idx] = idx - 1;
                }
            }

            const nextByDir = [nextUp, nextRight, nextDown, nextLeft];
            const dirChars = ['U', 'R', 'D', 'L'];

            const startBody = candidate.snakeStart.map(c => c.y * GRID_SIZE + c.x);
            const states = [{
                body: startBody,
                mask: 0,
                steps: 0,
                parent: -1,
                move: ''
            }];
            const queue = [0];
            let queueIndex = 0;

            const visitedByHeadMask = new Map();
            const startHeadMaskKey = (startBody[0] | (0 << 8)) >>> 0;
            visitedByHeadMask.set(startHeadMaskKey, new Set([encodeBodyShapePacked(startBody, GRID_SIZE)]));

            while (queueIndex < queue.length) {
                const stateIndex = queue[queueIndex++];
                const state = states[stateIndex];

                for (let dirIndex = 0; dirIndex < 4; dirIndex++) {
                    const next = advanceStatePacked(state.body, state.mask, dirIndex, nextByDir, wallBlocked, fruitAtCell);
                    if (!next.valid) {
                        continue;
                    }

                    if (next.mask === targetMask) {
                        return {
                            count: state.steps + 1,
                            moves: reconstructMoves(states, stateIndex, dirChars[dirIndex])
                        };
                    }

                    const headMaskKey = (next.body[0] | (next.mask << 8)) >>> 0;
                    const bodyShapeKey = encodeBodyShapePacked(next.body, GRID_SIZE);
                    const seenShapes = visitedByHeadMask.get(headMaskKey);
                    if (!seenShapes) {
                        visitedByHeadMask.set(headMaskKey, new Set([bodyShapeKey]));
                    } else if (seenShapes.has(bodyShapeKey)) {
                        continue;
                    } else {
                        seenShapes.add(bodyShapeKey);
                    }

                    states.push({
                        body: next.body,
                        mask: next.mask,
                        steps: state.steps + 1,
                        parent: stateIndex,
                        move: dirChars[dirIndex]
                    });
                    queue.push(states.length - 1);
                }
            }

            return { count: Infinity, moves: [] };
        }

        function reconstructMoves(states, stateIndex, lastMove) {
            const reversed = [lastMove];
            let cursor = stateIndex;

            while (cursor >= 0) {
                const state = states[cursor];
                if (state.move) {
                    reversed.push(state.move);
                }
                cursor = state.parent;
            }

            reversed.reverse();
            return reversed;
        }

        function encodeBodyShapePacked(body, width) {
            const length = body.length;
            if (length <= 1) {
                return (1 << 28) >>> 0;
            }

            let packed = 0;
            for (let i = 0; i < length - 1; i++) {
                const current = body[i];
                const next = body[i + 1];
                const diff = next - current;

                let code = 0;
                if (diff === -width) code = 0;
                else if (diff === 1) code = 1;
                else if (diff === width) code = 2;
                else if (diff === -1) code = 3;

                packed |= (code << (i * 2));
            }

            return (((length & 0x0f) << 28) | packed) >>> 0;
        }

        function advanceStatePacked(body, mask, dirIndex, nextByDir, wallBlocked, fruitAtCell) {
            const nextHead = nextByDir[dirIndex][body[0]];
            if (nextHead < 0 || wallBlocked[nextHead]) {
                return { valid: false };
            }

            const fruitAtHead = fruitAtCell[nextHead];
            const willEat = fruitAtHead >= 0 && (mask & (1 << fruitAtHead)) === 0;
            const collisionLimit = willEat ? body.length : body.length - 1;
            for (let i = 0; i < collisionLimit; i++) {
                if (body[i] === nextHead) {
                    return { valid: false };
                }
            }

            if (body.length === 2 && nextHead === body[1]) {
                return { valid: false };
            }

            const copyLength = willEat ? body.length : body.length - 1;
            const nextBody = new Array(copyLength + 1);
            nextBody[0] = nextHead;
            for (let i = 0; i < copyLength; i++) {
                nextBody[i + 1] = body[i];
            }

            let nextMask = mask;
            if (willEat) {
                nextMask |= (1 << fruitAtHead);
            }

            return { valid: true, body: nextBody, mask: nextMask };
        }

        function encodeState(body, mask) {
            const head = body[0];
            return `${mask}|${head.x},${head.y}`;
        }

        function advanceState(body, mask, dirKey, walls, fruitIndex) {
            const dir = DIRS[dirKey];
            const nextHead = { x: body[0].x + dir.x, y: body[0].y + dir.y };
            if (!inBounds(nextHead.x, nextHead.y) || walls.has(cellKey(nextHead.x, nextHead.y))) {
                return { valid: false };
            }

            const nextHeadKey = cellKey(nextHead.x, nextHead.y);
            const fruitAtHead = fruitIndex.has(nextHeadKey) ? fruitIndex.get(nextHeadKey) : -1;
            const willEat = fruitAtHead >= 0 && (mask & (1 << fruitAtHead)) === 0;
            const collisionBody = willEat ? body : body.slice(0, -1);
            if (collisionBody.some(c => c.x === nextHead.x && c.y === nextHead.y)) {
                return { valid: false };
            }

            // make sure it's invalid if the snake tries to move backward into itself, even if its size is 2 meaning that the tail would move away
            if (body.length === 2 && nextHead.x === body[1].x && nextHead.y === body[1].y) {
                return { valid: false };
            }

            const nextBody = [nextHead, ...body.map(c => ({ x: c.x, y: c.y }))];
            if (!willEat) {
                nextBody.pop();
            }

            let nextMask = mask;
            if (willEat) {
                nextMask |= (1 << fruitAtHead);
            }

            return { valid: true, body: nextBody, mask: nextMask };
        }

        function simulateMoves(moves) {
            if (!puzzle) {
                return { frames: [], state: 'running', movesUsed: 0, fruitsEaten: 0 };
            }

            const fruitIndex = new Map();
            puzzle.fruits.forEach((fruit, i) => fruitIndex.set(cellKey(fruit.x, fruit.y), i));
            const targetMask = (1 << puzzle.fruits.length) - 1;

            let body = puzzle.snakeStart.map(c => ({ x: c.x, y: c.y }));
            let mask = 0;
            const frames = [{ body: body.map(c => ({ ...c })), mask, state: 'running' }];
            let resultState = 'running';

            for (let i = 0; i < moves.length; i++) {
                const step = advanceState(body, mask, moves[i], puzzle.walls, fruitIndex);
                if (!step.valid) {
                    resultState = 'dead';
                    frames.push({ body: body.map(c => ({ ...c })), mask, state: 'dead' });
                    return { frames, state: resultState, movesUsed: i + 1, fruitsEaten: countBits(mask) };
                }
                body = step.body;
                mask = step.mask;

                if (mask === targetMask) {
                    resultState = 'win';
                    frames.push({ body: body.map(c => ({ ...c })), mask, state: 'win' });
                    return { frames, state: resultState, movesUsed: i + 1, fruitsEaten: puzzle.fruits.length };
                }

                frames.push({ body: body.map(c => ({ ...c })), mask, state: 'running' });
            }

            return { frames, state: resultState, movesUsed: moves.length, fruitsEaten: countBits(mask) };
        }

        function countBits(num) {
            let n = num;
            let count = 0;
            while (n) {
                count += n & 1;
                n >>= 1;
            }
            return count;
        }

        function refreshMoveGrid() {
            const simulation = simulateMoves(queueMoves);
            if (!puzzle) {
                for (let i = 0; i < moveCells.length; i++) {
                    const cell = moveCells[i];
                    cell.textContent = '';
                    cell.classList.remove('filled', 'crash');
                }
                return;
            }
            const crashIndex = simulation.state === 'dead' ? simulation.movesUsed - 1 : -1;
            for (let i = 0; i < moveCells.length; i++) {
                const move = queueMoves[i];
                const cell = moveCells[i];
                if (move) {
                    cell.textContent = ARROW[move];
                    cell.classList.add('filled');
                    cell.classList.toggle('crash', i === crashIndex);
                } else {
                    cell.textContent = '';
                    cell.classList.remove('filled', 'crash');
                }
            }
        }

        function drawBoard(frame) {
            ctx.fillStyle = '#0c2030';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(125, 223, 223, 0.18)';
            ctx.lineWidth = 1;
            for (let c = 0; c <= GRID_SIZE; c++) {
                ctx.beginPath();
                ctx.moveTo(c * CELL_SIZE, 0);
                ctx.lineTo(c * CELL_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let r = 0; r <= GRID_SIZE; r++) {
                ctx.beginPath();
                ctx.moveTo(0, r * CELL_SIZE);
                ctx.lineTo(canvas.width, r * CELL_SIZE);
                ctx.stroke();
            }

            for (const key of puzzle.walls) {
                const { x, y } = parseKey(key);
                const px = x * CELL_SIZE;
                const py = y * CELL_SIZE;
                ctx.fillStyle = '#24384a';
                ctx.fillRect(px + 6, py + 6, CELL_SIZE - 12, CELL_SIZE - 12);
                ctx.strokeStyle = '#3e5a71';
                ctx.lineWidth = 2;
                ctx.strokeRect(px + 6, py + 6, CELL_SIZE - 12, CELL_SIZE - 12);
            }

            const collectedMask = frame.mask;
            puzzle.fruits.forEach((fruit, index) => {
                if ((collectedMask & (1 << index)) !== 0) {
                    return;
                }
                const fx = fruit.x * CELL_SIZE + CELL_SIZE / 2;
                const fy = fruit.y * CELL_SIZE + CELL_SIZE / 2;
                const fr = CELL_SIZE * 0.22;
                ctx.fillStyle = '#e05555';
                ctx.beginPath();
                ctx.arc(fx, fy, fr, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ff9999';
                ctx.beginPath();
                ctx.arc(fx - fr * 0.35, fy - fr * 0.35, fr * 0.28, 0, Math.PI * 2);
                ctx.fill();
            });

            for (let i = frame.body.length - 1; i >= 0; i--) {
                const segment = frame.body[i];
                const x = segment.x * CELL_SIZE;
                const y = segment.y * CELL_SIZE;
                const pad = 6;
                const size = CELL_SIZE - pad * 2;
                const radius = 12;
                ctx.fillStyle = i === 0 ? '#7ddfdf' : '#126364';
                ctx.strokeStyle = '#0a4a4a';
                ctx.lineWidth = 2;

                roundRect(ctx, x + pad, y + pad, size, size, radius);
                ctx.fill();
                ctx.stroke();
            }

            if (frame.body.length > 0) {
                const head = frame.body[0];
                const neck = frame.body[1];
                let dx = 1;
                let dy = 0;
                if (neck) {
                    dx = head.x - neck.x;
                    dy = head.y - neck.y;
                }

                const headX = head.x * CELL_SIZE;
                const headY = head.y * CELL_SIZE;
                const eyeR = CELL_SIZE * 0.11;

                let eye1 = [headX + CELL_SIZE * 0.28, headY + CELL_SIZE * 0.3];
                let eye2 = [headX + CELL_SIZE * 0.72, headY + CELL_SIZE * 0.3];
                if (dx > 0) {
                    eye1 = [headX + CELL_SIZE * 0.68, headY + CELL_SIZE * 0.3];
                    eye2 = [headX + CELL_SIZE * 0.68, headY + CELL_SIZE * 0.7];
                } else if (dx < 0) {
                    eye1 = [headX + CELL_SIZE * 0.32, headY + CELL_SIZE * 0.3];
                    eye2 = [headX + CELL_SIZE * 0.32, headY + CELL_SIZE * 0.7];
                } else if (dy > 0) {
                    eye1 = [headX + CELL_SIZE * 0.3, headY + CELL_SIZE * 0.68];
                    eye2 = [headX + CELL_SIZE * 0.7, headY + CELL_SIZE * 0.68];
                }

                ctx.fillStyle = '#042223';
                ctx.beginPath();
                ctx.arc(eye1[0], eye1[1], eyeR, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(eye2[0], eye2[1], eyeR, 0, Math.PI * 2);
                ctx.fill();
            }

            if (frame.state === 'dead') {
                ctx.fillStyle = 'rgba(224, 85, 85, 0.28)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function roundRect(context, x, y, w, h, r) {
            context.beginPath();
            context.moveTo(x + r, y);
            context.lineTo(x + w - r, y);
            context.quadraticCurveTo(x + w, y, x + w, y + r);
            context.lineTo(x + w, y + h - r);
            context.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            context.lineTo(x + r, y + h);
            context.quadraticCurveTo(x, y + h, x, y + h - r);
            context.lineTo(x, y + r);
            context.quadraticCurveTo(x, y, x + r, y);
            context.closePath();
        }

        function refreshPlayback() {
            if (playbackTimer) {
                clearInterval(playbackTimer);
                playbackTimer = null;
            }

            if (!puzzle) {
                statusLineEl.textContent = isGeneratingPuzzle
                    ? 'Generating daily map...'
                    : 'Map unavailable.';
                fruitProgressEl.textContent = `Fruits: 0 / ${FRUIT_COUNT}`;
                moveProgressEl.textContent = 'Moves: 0 / --';
                return;
            }

            const simulation = simulateMoves(queueMoves);
            playbackFrames = simulation.frames;
            fruitProgressEl.textContent = `Fruits: ${simulation.fruitsEaten} / ${FRUIT_COUNT}`;
            moveProgressEl.textContent = `Moves: ${queueMoves.length} / ${optimalMoves.count}`;
            drawBoard(playbackFrames[playbackFrames.length - 1]);
            if (autoSubmitTimer) {
                clearTimeout(autoSubmitTimer);
                autoSubmitTimer = null;
            }
            if (queueMoves.length === 0) {
                statusLineEl.textContent = 'Use the buttons or arrow keys to queue moves.';
                return;
            }
            if (simulation.state === 'dead') {
                statusLineEl.textContent = 'Route crashes. Undo or clear and try again.';
            } else if (simulation.state === 'win') {
                if (simulation.movesUsed <= optimalMoves.count && !isSubmitting) {
                    statusLineEl.textContent = 'Perfect route found! Auto-submitting...';
                    autoSubmitTimer = setTimeout(() => submitRun(true), AUTO_SUBMIT_DELAY_MS);
                    return;
                }
                statusLineEl.textContent = 'All fruits collected. Submit to watch the full replay.';
            } else {
                const last = queueMoves[queueMoves.length - 1];
                statusLineEl.textContent = `Queued move ${queueMoves.length}: ${ARROW[last]}`;
            }
        }

        function playSubmissionAnimation(simulation, onDone) {
            if (playbackTimer) {
                clearInterval(playbackTimer);
                playbackTimer = null;
            }
            playbackFrames = simulation.frames;
            let frameIndex = 0;
            drawBoard(playbackFrames[frameIndex]);
            if (playbackFrames.length <= 1) {
                onDone();
                return;
            }
            playbackTimer = setInterval(() => {
                frameIndex += 1;
                drawBoard(playbackFrames[Math.min(frameIndex, playbackFrames.length - 1)]);
                if (frameIndex >= playbackFrames.length - 1) {
                    clearInterval(playbackTimer);
                    playbackTimer = null;
                    onDone();
                }
            }, FRAME_DURATION_MS);
        }

        function getCurrentHeadingDir() {
            return getHeadingDirForMoves(queueMoves);
        }

        function getHeadingDirForMoves(moves) {
            if (moves.length > 0) {
                return moves[moves.length - 1];
            }
            const [head, neck] = puzzle.snakeStart;
            const dx = head.x - neck.x;
            const dy = head.y - neck.y;
            if (dx === 1) return 'R';
            if (dx === -1) return 'L';
            if (dy === 1) return 'D';
            return 'U';
        }

        function getFruitIndexMap() {
            const fruitIndex = new Map();
            puzzle.fruits.forEach((fruit, i) => fruitIndex.set(cellKey(fruit.x, fruit.y), i));
            return fruitIndex;
        }

        function tryReplaceCrashMove(dirKey) {
            if (queueMoves.length === 0) {
                return false;
            }

            const candidateMoves = queueMoves.slice(0, -1);
            const heading = getHeadingDirForMoves(candidateMoves);
            if (dirKey === OPPOSITE[heading]) {
                return false;
            }

            const simulationBeforeCrashMove = simulateMoves(candidateMoves);
            if (!simulationBeforeCrashMove.frames.length || simulationBeforeCrashMove.state === 'dead') {
                return false;
            }

            const lastFrame = simulationBeforeCrashMove.frames[simulationBeforeCrashMove.frames.length - 1];
            const body = lastFrame.body.map(c => ({ ...c }));
            const fruitIndex = getFruitIndexMap();
            const step = advanceState(body, lastFrame.mask, dirKey, puzzle.walls, fruitIndex);
            if (!step.valid) {
                return false;
            }

            queueMoves.splice(0, queueMoves.length, ...candidateMoves, dirKey);
            return true;
        }

        function addMove(dirKey) {
            if (isGeneratingPuzzle || !puzzle) return;
            const currentSimulation = simulateMoves(queueMoves);
            if (currentSimulation.state === 'dead') {
                if (tryReplaceCrashMove(dirKey)) {
                    refreshMoveGrid();
                    refreshPlayback();
                } else {
                    statusLineEl.textContent = 'Route already crashes. Undo or clear to continue.';
                }
                return;
            }
            if (currentSimulation.state === 'win') {
                statusLineEl.textContent = 'All fruits are already collected. Submit your run or edit it.';
                return;
            }
            if (queueMoves.length >= MAX_MOVES) {
                statusLineEl.textContent = `Move queue is full (${MAX_MOVES}). Submit, undo, or clear.`;
                return;
            }
            const heading = getCurrentHeadingDir();
            if (dirKey === OPPOSITE[heading]) {
                statusLineEl.textContent = 'Cannot reverse directly into the snake.';
                return;
            }
            queueMoves.push(dirKey);
            refreshMoveGrid();
            refreshPlayback();
        }

        function undoMove() {
            if (queueMoves.length === 0) {
                return;
            }
            queueMoves.pop();
            refreshMoveGrid();
            refreshPlayback();
        }

        function clearMoves() {
            queueMoves.length = 0;
            refreshMoveGrid();
            refreshPlayback();
        }

        function performanceEmoji(used, optimal) {
            // blue box emoji for perfect, then green for one off, yellow for 2-3 off, orange for 3-6 off, red for 7+ off
            const off_by = used - optimal;
            if (off_by < 0) return '!🟪!';
            if (off_by === 0) return '🟦';
            if (off_by === 1) return '🟩';
            if (off_by <= 3) return '🟨';
            if (off_by <= 6) return '🟧';
            return '🟥';
        }
        function submitRun(isAuto = false) {
            if (isGeneratingPuzzle || !puzzle) {
                statusLineEl.textContent = 'Please wait for map generation to finish.';
                return;
            }
            const isAutoSubmit = isAuto === true;
            if (isSubmitting) {
                return;
            }
            if (autoSubmitTimer) {
                clearTimeout(autoSubmitTimer);
                autoSubmitTimer = null;
            }
            const simulation = simulateMoves(queueMoves);
            if (simulation.state !== 'win') {
                statusLineEl.textContent = 'You need a valid route that collects all ' + FRUIT_COUNT + ' fruits before submitting.';
                return;
            }
            if (isAutoSubmit && simulation.movesUsed !== optimalMoves.count) {
                return;
            }

            setButtonsDisabledState(true); // Disable buttons during submission

            const usedMoves = simulation.movesUsed;
            const emoji = performanceEmoji(usedMoves, optimalMoves.count);
            const shareText = `Snakedle Day ${dayNumber} : ${usedMoves}/${optimalMoves.count} ${emoji}\nhttps://egeeken.github.io/snakedle`;
            resultsTextEl.textContent = shareText;
            statusLineEl.textContent = 'Submitting... replaying your run.';
            isSubmitting = true;
            playSubmissionAnimation(simulation, () => {
                resultsModal.style.display = 'flex';
                localStorage.setItem(
                    `snakedle-${dayNumber}`,
                    JSON.stringify({ usedMoves, optimalMoves, emoji, at: new Date().toISOString() })
                );
                isSubmitting = false;
                setButtonsDisabledState(false); // Re-enable buttons after submission
            });
        }

        // Disable undo and clear buttons during submission or animations
        const undoButton = document.getElementById('undo-move');
        const clearButton = document.getElementById('clear-moves');

        function setButtonsDisabledState(disabled) {
            undoButton.disabled = disabled;
            clearButton.disabled = disabled;
        }

        document.querySelectorAll('[data-dir]').forEach(btn => {
            btn.addEventListener('click', () => addMove(btn.dataset.dir));
        });

        undoButton.addEventListener('click', undoMove);
        clearButton.addEventListener('click', clearMoves);
        document.getElementById('submit-snakedle').addEventListener('click', () => submitRun());

        document.addEventListener('keydown', (e) => {
            const target = e.target;
            if (
                target instanceof HTMLElement &&
                (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)
            ) {
                return;
            }
            const keyMap = {
                ArrowUp: 'U',
                ArrowDown: 'D',
                ArrowLeft: 'L',
                ArrowRight: 'R',
                w: 'U',
                W: 'U',
                s: 'D',
                S: 'D',
                a: 'L',
                A: 'L',
                d: 'R',
                D: 'R'
            };
            if (keyMap[e.key]) {
                e.preventDefault();
                addMove(keyMap[e.key]);
            } else if (e.key === 'Backspace' || e.key === 'Z' || e.key === 'z') {
                e.preventDefault();
                undoMove();
            } else if (e.key === 'Escape' || e.key === 'C' || e.key === 'c') {
                e.preventDefault();
                clearMoves();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                submitRun();
            }
        });

        document.getElementById('copy-share').addEventListener('click', async () => {
            const text = resultsTextEl.textContent;
            try {
                await navigator.clipboard.writeText(text);
                statusLineEl.textContent = 'Share text copied to clipboard.';
            } catch (err) {
                const temp = document.createElement('textarea');
                temp.value = text;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
                statusLineEl.textContent = 'Share text copied to clipboard.';
            }
        });

        document.getElementById('close-results').addEventListener('click', () => {
            resultsModal.style.display = 'none';
        });

        resultsModal.addEventListener('click', (e) => {
            if (e.target === resultsModal) {
                resultsModal.style.display = 'none';
            }
        });

        initializeGame();
    </script>
</body>
