name: Patch Bortkiewicz recommendations

on:
  push:
    paths:
      - .github/workflows/patch-bortkiewicz-recommendations.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Bortkiewicz concertos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("recommendations-classical.html")
          text = page.read_text(encoding="utf-8")

          old = r'''{"composer":"Karłowicz","title":"Lithuanian Rhapsody, Op. 11","video":"wJKhuwq-xsM","iframeTitle":"Mieczysław Karłowicz - Lithuanian Rhapsody, Op. 11","slug":"karlowicz","extras":[{"title":"Serenade for Strings, Op. 2","video":"RNxPMBVkjJc","iframeTitle":"Mieczysław Karłowicz - Serenade for Strings, Op. 2"},{"title":"Violin Concerto in A major, Op. 8","video":"TW-9L_n2cDw","iframeTitle":"Mieczysław Karłowicz - Violin Concerto in A major, Op. 8"}]}]},{"era":"MODERN"'''
          new = r'''{"composer":"Karłowicz","title":"Lithuanian Rhapsody, Op. 11","video":"wJKhuwq-xsM","iframeTitle":"Mieczysław Karłowicz - Lithuanian Rhapsody, Op. 11","slug":"karlowicz","extras":[{"title":"Serenade for Strings, Op. 2","video":"RNxPMBVkjJc","iframeTitle":"Mieczysław Karłowicz - Serenade for Strings, Op. 2"},{"title":"Violin Concerto in A major, Op. 8","video":"TW-9L_n2cDw","iframeTitle":"Mieczysław Karłowicz - Violin Concerto in A major, Op. 8"}]},{"composer":"Bortkiewicz","title":"Piano Concerto No. 2 for the Left Hand, Op. 28","video":"WlXf1goh1HM","iframeTitle":"Sergei Bortkiewicz - Piano Concerto No. 2 for the Left Hand, Op. 28 - Stefan Doniga, Janáček Philharmonic Orchestra, David Porcelijn","note":"Favorite: III. Allegro dramatico","slug":"bortkiewicz","extras":[{"title":"Piano Concerto No. 3 in C minor, Op. 32 \"Per aspera ad astra\"","video":"WlXf1goh1HM?start=1756","iframeTitle":"Sergei Bortkiewicz - Piano Concerto No. 3 in C minor, Op. 32 - Stefan Doniga, Janáček Philharmonic Orchestra, David Porcelijn","note":"Starts at 29:16 in the full album upload."}]}]},{"era":"MODERN"'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one insertion point, found {count}")

          page.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/patch-bortkiewicz-recommendations.yml").unlink()
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recommendations-classical.html .github/workflows/patch-bortkiewicz-recommendations.yml
          git commit -m "Add Bortkiewicz piano concertos"
          git push
