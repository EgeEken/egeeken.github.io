name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/configure-pages@v5
      - uses: actions/cache@v4
        with:
          path: .preview-cache
          key: ${{ runner.os }}-previews-${{ hashFiles('scripts/build_site.py', 'assets/photography/**', 'assets/art/**', 'assets/ege.png', 'assets/ege music.png', 'assets/favorite_photo.jpg') }}
          restore-keys: ${{ runner.os }}-previews-
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
