name: Update Bortkiewicz links

on:
  push:
    paths:
      - .github/workflows/update-bortkiewicz-links.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Bortkiewicz video links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("recommendations-classical.html")
          text = page.read_text(encoding="utf-8")
          replacements = {
              '"video":"WlXf1goh1HM","iframeTitle":"Sergei Bortkiewicz - Piano Concerto No. 2 for the Left Hand, Op. 28':
              '"video":"HO5xUkrXbxo","iframeTitle":"Sergei Bortkiewicz - Piano Concerto No. 2 for the Left Hand, Op. 28',
              '"video":"WlXf1goh1HM?start=1756","iframeTitle":"Sergei Bortkiewicz - Piano Concerto No. 3 in C minor, Op. 32':
              '"video":"NyELx8RKRUA","iframeTitle":"Sergei Bortkiewicz - Piano Concerto No. 3 in C minor, Op. 32',
              ',"note":"Starts at 29:16 in the full album upload."': ''
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old}")
              text = text.replace(old, new)
          page.write_text(text, encoding="utf-8")
          Path(".github/workflows/update-bortkiewicz-links.yml").unlink()
          PY
      - name: Commit updated links
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recommendations-classical.html .github/workflows/update-bortkiewicz-links.yml
          git commit -m "Update Bortkiewicz concerto links"
          git push
