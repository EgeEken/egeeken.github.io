name: Patch classical recommendations

on:
  push:
    paths:
      - .github/workflows/patch-classical-recommendations.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update recommendation entries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("recommendations-classical.html")
          text = page.read_text(encoding="utf-8")

          replacements = {
              r'''{"composer":"Vivaldi","title":"Violin Concerto in E Minor, Op. 4 No. 2, RV 279, \"La Stravaganza\"","video":"QP73569coeo","iframeTitle":"Antonio Vivaldi - La Stravaganza"}''':
              r'''{"composer":"Vivaldi","title":"The Four Seasons, Op. 8","video":"zzE-kVadtNw","iframeTitle":"Vivaldi - The Four Seasons - Janine Jansen","note":"Favorites: Spring 1, Summer 3, Autumn 1, Winter 1, 2, 3","slug":"vivaldi","extras":[{"title":"Violin Concerto in E Minor, Op. 4 No. 2, RV 279, \"La Stravaganza\"","video":"QP73569coeo","iframeTitle":"Antonio Vivaldi - La Stravaganza"}]}''',
              r'''{"composer":"Liszt","title":"Mephisto Waltz No. 1 in A major, S. 514","video":"KJbg9V2KnD8","iframeTitle":"Liszt - Mephisto Waltz No. 1, S. 514"}''':
              r'''{"composer":"Liszt","title":"Mephisto Waltz No. 1 in A major, S. 514","video":"KJbg9V2KnD8","iframeTitle":"Liszt - Mephisto Waltz No. 1, S. 514","slug":"liszt","extras":[{"title":"Piano Sonata in B minor, S. 178","video":"gRaGPsett04","iframeTitle":"Liszt - Piano Sonata in B minor, S. 178"}]}''',
              r'''{"composer":"Sibelius","title":"Violin Concerto in D minor, Op. 47","video":"3u-unvYedx8","iframeTitle":"SIBELIUS Violin Concerto in D minor, Op. 47"}''':
              r'''{"composer":"Sibelius","title":"Violin Concerto in D minor, Op. 47","video":"3u-unvYedx8","iframeTitle":"SIBELIUS Violin Concerto in D minor, Op. 47","slug":"sibelius","extras":[{"title":"Symphony No. 2 in D major, Op. 43","video":"iXU8EXL7a_4","iframeTitle":"Sibelius - Symphony No. 2 in D major, Op. 43 - hr-Sinfonieorchester"}]}''',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:80]}")
              text = text.replace(old, new)

          page.write_text(text, encoding="utf-8")
          Path(".github/workflows/patch-classical-recommendations.yml").unlink()
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recommendations-classical.html .github/workflows/patch-classical-recommendations.yml
          git commit -m "Update classical music recommendations"
          git push
