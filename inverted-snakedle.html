<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Ege - Inverted Snakedle</title>
    <style>
        :root {
            --snakedle-grid-size: 6;
        }

        #snakedle-wrapper {
            width: min(980px, 96%);
            margin: 20px auto 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            color: #eee;
        }

        .snakedle-stat {
            font-family: 'Futura', sans-serif;
            letter-spacing: 1px;
            text-align: center;
            font-size: 1.1em;
        }

        .snakedle-stat#daily-label {
            font-size: 1.3em;
            font-weight: 700;
            color: #7ddfdf;
        }

        #snakedle-layout {
            width: 100%;
            display: grid;
            grid-template-columns: minmax(235px, 235px) minmax(280px, 1fr) minmax(235px, 235px);
            gap: 150px;
            align-items: center;
        }

        .snakedle-panel {
            background: rgba(12, 32, 48, 0.72);
            border: 1px solid rgba(125, 223, 223, 0.25);
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 0 15px rgba(12, 32, 48, 0.35);
        }

        #snakedle-board-wrap {
            position: relative;
            display: flex;
            justify-content: center;
        }

        #generation-overlay {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(5, 12, 20, 0.62);
            backdrop-filter: blur(4px);
            border-radius: 10px;
            z-index: 20;
            color: #fff;
            font-family: 'Futura', sans-serif;
            letter-spacing: 0.6px;
            text-align: center;
            pointer-events: all;
        }

        .loading-spinner {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.35);
            border-top-color: #fff;
            border-right-color: transparent;
            animation: snakedle-spin 0.9s linear infinite;
        }

        #generation-progress {
            font-size: 0.9em;
            opacity: 0.9;
        }

        @keyframes snakedle-spin {
            to {
                transform: rotate(360deg);
            }
        }

        #snakedle-canvas {
            width: min(94vw, 672px);
            height: auto;
            border: 3px solid #126364;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(18, 99, 100, 0.5);
            background-color: #0c2030;
        }

        #dpad-snakedle {
            display: grid;
            gap: 8px;
            justify-items: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .dpad-row {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .snakedle-btn {
            width: clamp(46px, 7vw, 58px);
            height: clamp(46px, 7vw, 58px);
            border: none;
            border-radius: 8px;
            background-color: #126364;
            color: #eee;
            font-size: clamp(1.05em, 1.8vw, 1.25em);
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 0 8px rgba(18, 99, 100, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 1;
            font-weight: 700;
        }

        .snakedle-btn:active {
            transform: scale(0.95);
            background-color: #0d4f50;
        }

        .snakedle-btn.alt {
            width: calc(50% - 6px);
            font-size: 0.9em;
            height: 42px;
            margin-top: 6px;
        }

        #move-grid {
            display: grid;
            grid-template-columns: repeat(var(--snakedle-grid-size), minmax(0, 1fr));
            gap: clamp(2px, 0.6vw, 5px);
            margin-top: 6px;
            margin-bottom: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .move-cell {
            aspect-ratio: 1;
            min-width: 0;
            border-radius: 6px;
            border: 1px solid rgba(187, 221, 221, 0.35);
            background: rgba(12, 32, 48, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cbe4e4;
            font-size: var(--snakedle-move-icon-size, 1.1em);
            font-family: 'Futura', sans-serif;
            overflow: hidden;
            line-height: 1;
            font-weight: 700;
        }

        .move-cell.filled {
            background: rgba(18, 99, 100, 0.85);
            color: #fff;
            border-color: rgba(125, 223, 223, 0.8);
        }

        .move-cell.crash {
            background: rgba(224, 85, 85, 0.78);
            border-color: rgba(255, 170, 170, 0.9);
            color: #fff;
        }

        #submit-snakedle {
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            background-color: #7ddfdf;
            color: #102334;
            font-family: 'Futura', sans-serif;
            font-size: 1em;
            cursor: pointer;
            font-weight: 700;
            transition: transform 0.15s, background-color 0.25s;
        }

        #submit-snakedle:hover {
            transform: scale(1.02);
            background-color: #a7eded;
        }

        #status-line {
            margin-top: 8px;
            color: #bbd;
            min-height: 22px;
            text-align: center;
            font-size: 0.92em;
        }

        #results-modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(8, 15, 24, 0.78);
            z-index: 1200;
        }

        #results-card {
            width: min(92vw, 460px);
            background: #102334;
            border: 2px solid #126364;
            border-radius: 12px;
            padding: 18px;
            color: #eee;
            text-align: center;
            box-shadow: 0 0 30px rgba(8, 15, 24, 0.7);
        }

        #results-text {
            white-space: pre-wrap;
            text-align: left;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0 14px;
        }

        .results-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .results-actions button {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-family: 'Futura', sans-serif;
            cursor: pointer;
        }

        #copy-share {
            background: #7ddfdf;
            color: #102334;
            font-weight: 700;
        }

        #close-results {
            background: #2e4b61;
            color: #e8f0f0;
        }

        @media (max-width: 1000px) {
            #snakedle-layout {
                grid-template-columns: 1fr;
                row-gap: 50px;
                column-gap: 150px;
            }

            #snakedle-board-wrap {
                order: -1;
            }
        }

        @media (max-width: 480px) {
            .snakedle-btn {
                width: 52px;
                height: 52px;
            }
        }

        header h1 {
            margin-top: 3% !important;
            transition: margin-top 0.3s ease;
        }

        @media screen and (max-width: 700px) {
            header h1 {
                margin-top: 16% !important;
            }
        }

        .tutorial-button {
			width: min(360px, 92vw);
			padding: 12px 16px;
			border: none;
			border-radius: 10px;
			background-color: #7ddfdf;
			color: #102334;
			font-family: 'Futura', sans-serif;
			font-size: 1.05em;
			font-weight: 700;
			letter-spacing: 0.6px;
			cursor: pointer;
			transition: transform 0.15s, background-color 0.25s;
			text-decoration: none;
			text-align: center;
			box-shadow: 0 0 14px rgba(125, 223, 223, 0.38);
		}

		.tutorial-button:hover {
			transform: scale(1.02);
			background-color: #a7eded;
		}

        .calendar-button {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 8px;
            background: #273a4d;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35em;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, background-color 0.25s;
            z-index: 1000;
        }

        .calendar-button:hover {
            background-color: #126364;
            transform: scale(1.06);
        }
    </style>
</head>

<body>
    <header>
        <a id="back-nav-button" href="/games/inverted-snakedle/" class="back-button">← Return to Menu</a>
        <a id="calendar-nav-button" href="inverted-snakedle-calendar.html" class="calendar-button" aria-label="Open calendar">📅</a>
        <h1><b>Inverted Snakedle</b></h1>
        <h2><a class="tutorial-button" href="games/inverted-snakedle/inverted-snakedle-tutorial.html">Tutorial</a></h2>
        
    </header>

    <main id="snakedle-wrapper">
        <div class="snakedle-panel">
            <div class="snakedle-stat" id="daily-label">Inverted Snakedle Day --</div>
            <div class="snakedle-stat" id="fruit-progress">Fruits: 0 / --</div>
            <div class="snakedle-stat" id="move-progress">Moves: 0 / --</div>
        </div>

        <section id="snakedle-layout">
            <div class="snakedle-panel">
                <div id="dpad-snakedle">
                    <button class="snakedle-btn" data-dir="U" aria-label="Up">▴</button>
                    <div class="dpad-row">
                        <button class="snakedle-btn" data-dir="L" aria-label="Left">◂</button>
                        <button class="snakedle-btn" data-dir="D" aria-label="Down">▾</button>
                        <button class="snakedle-btn" data-dir="R" aria-label="Right">▸</button>
                    </div>
                    <div class="dpad-row" style="width:100%;">
                        <button class="snakedle-btn alt" id="undo-move">Undo</button>
                        <button class="snakedle-btn alt" id="clear-moves">Clear</button>
                    </div>
                </div>
                <div id="status-line">Use the buttons or arrow keys to queue moves.</div>
            </div>

            <div id="snakedle-board-wrap">
                <canvas id="snakedle-canvas" width="420" height="420"></canvas>
                <div id="generation-overlay" aria-live="polite" aria-busy="true">
                    <div class="loading-spinner" aria-hidden="true"></div>
                    <div id="generation-message">Generating map...</div>
                    <div id="generation-progress">Attempts: 0 / 0</div>
                </div>
            </div>

            <div class="snakedle-panel">
                <div style="text-align:center; margin-bottom:4px;">Move Queue</div>
                <div id="move-grid"></div>
                <button id="submit-snakedle">Submit run</button>
            </div>
        </section>
    </main>

    <div id="results-modal" role="dialog" aria-modal="true">
        <div id="results-card">
            <h3>Result</h3>
            <div id="results-text"></div>
            <div class="results-actions">
                <button id="copy-share">Copy Share Text</button>
                <button id="close-results">Close</button>
            </div>
        </div>
    </div>

    <script>
        const DAILY_PARAMETER_LIMITS = {
            mapSize: { min: 7, max: 10 },
            fruitCount: { min: 8, max: 13 },
            wallCount: { min: 10, max: 30 }
        };
        const SELECTED_DAY_PARAMS_URL = 'assets/snakedle-selected-day-params.json';
        const PRELOADED_DAILIES_URL = 'assets/preloaded_dailies.json';
        const PRELOADED_MAP_GAME_KEY = 'snakedle';
        const PRELOADED_META_GAME_KEY = 'invertedSnakedle';
        let selectedDayParamsByDay = {
            4: { mapSize: 8, fruitCount: 12, wallCount: 20 },
            5: { mapSize: 9, fruitCount: 10, wallCount: 30 },
            7: { mapSize: 8, fruitCount: 12, wallCount: 20 },
            20: { mapSize: 8, fruitCount: 12, wallCount: 20 },
            25: { mapSize: 8, fruitCount: 10, wallCount: 17 }
        };
        let preloadedMapByDay = {};
        let preloadedMetaByDay = {};
        const LAUNCH_DAY_UTC = Date.UTC(2026, 2, 19); // March 19, 2026
        const todayDayNumber = getDayNumber(new Date());
        const daySelection = resolveRequestedDay(window.location.hash, todayDayNumber);
        const dayNumber = daySelection.dayNumber;
        const isAdminPreviewDay = daySelection.isAdminPreviewDay;
        const queryDailyParameterOverride = parseDailyParameterOverride(window.location.search);
        let dailyParameters = queryDailyParameterOverride || pickConstrainedParameters(dayNumber, DAILY_PARAMETER_LIMITS);
        let GRID_SIZE = dailyParameters.mapSize;
        let CELL_SIZE = 420 / GRID_SIZE;
        let FRUIT_COUNT = dailyParameters.fruitCount;
        let WALL_COUNT = dailyParameters.wallCount;
        const MAX_GEN_ATTEMPTS = 10000;
        const MAX_GEN_TIME_MS = 10000;
        const MAX_SEARCH = 500000;
        const GENERATION_PROGRESS_UPDATE_EVERY = 8;

        const DIRS = {
            U: { x: 0, y: -1 },
            D: { x: 0, y: 1 },
            L: { x: -1, y: 0 },
            R: { x: 1, y: 0 }
        };
        const DIR_ORDER = ['U', 'R', 'D', 'L'];
        const ARROW = { U: '▴', D: '▾', L: '◂', R: '▸' };
        const MOVE_ICON_MIN_SIZE_EM = 0.7;
        const MOVE_ICON_BASE_SIZE_EM = 1.2;
        const MOVE_ICON_REFERENCE_GRID_SIZE = 6;
        const MOVE_ICON_SIZE_STEP_EM = 0.13;

        const canvas = document.getElementById('snakedle-canvas');
        const ctx = canvas.getContext('2d');
        const fruitProgressEl = document.getElementById('fruit-progress');
        const moveProgressEl = document.getElementById('move-progress');
        const dailyLabelEl = document.getElementById('daily-label');
        const moveGridEl = document.getElementById('move-grid');
        const statusLineEl = document.getElementById('status-line');
        const resultsModal = document.getElementById('results-modal');
        const resultsTextEl = document.getElementById('results-text');
        const generationOverlayEl = document.getElementById('generation-overlay');
        const generationMessageEl = document.getElementById('generation-message');
        const generationProgressEl = document.getElementById('generation-progress');
        const backNavButtonEl = document.getElementById('back-nav-button');
        const calendarNavButtonEl = document.getElementById('calendar-nav-button');

        const queueMoves = [];
        const moveCells = [];
        const OPPOSITE = { U: 'D', D: 'U', L: 'R', R: 'L' };
        const FRAME_DURATION_MS = 120;
        const AUTO_SUBMIT_DELAY_MS = 120;

        function parseDailyParameterOverride(search) {
            const params = new URLSearchParams(search || '');
            const mapSize = Number(params.get('mapSize'));
            const fruitCount = Number(params.get('fruitCount'));
            const wallCount = Number(params.get('wallCount'));

            if (!Number.isFinite(mapSize) || !Number.isFinite(fruitCount) || !Number.isFinite(wallCount)) {
                return null;
            }

            if (!isValidParameterSet(mapSize, fruitCount, wallCount)) {
                return null;
            }

            return { mapSize, fruitCount, wallCount };
        }

        function applyDailyParameters(params) {
            GRID_SIZE = params.mapSize;
            FRUIT_COUNT = params.fruitCount;
            WALL_COUNT = params.wallCount;
            CELL_SIZE = 420 / GRID_SIZE;

            document.documentElement.style.setProperty('--snakedle-grid-size', String(GRID_SIZE));
            document.documentElement.style.setProperty(
                '--snakedle-move-icon-size',
                `${Math.max(
                    MOVE_ICON_MIN_SIZE_EM,
                    MOVE_ICON_BASE_SIZE_EM - (GRID_SIZE - MOVE_ICON_REFERENCE_GRID_SIZE) * MOVE_ICON_SIZE_STEP_EM
                )}em`
            );
        }

        function updateBackButtonForHash(hash) {
            if (!backNavButtonEl) return;

            const token = String(hash || '').replace(/^#/, '').trim();
            const isAdminDayHash = /^admin-(\d+)$/i.test(token);
            const isRegularDayHash = /^(\d+)$/.test(token);

            if (isAdminDayHash) {
                backNavButtonEl.href = 'inverted-snakedle-admin-calendar.html';
                backNavButtonEl.textContent = '← Return to Admin Calendar';
                if (calendarNavButtonEl) {
                    calendarNavButtonEl.href = 'inverted-snakedle-admin-calendar.html';
                }
                return;
            }

            if (isRegularDayHash) {
                backNavButtonEl.href = 'inverted-snakedle-calendar.html';
                backNavButtonEl.textContent = '← Return to Calendar';
                if (calendarNavButtonEl) {
                    calendarNavButtonEl.href = 'inverted-snakedle-calendar.html';
                }
                return;
            }

            backNavButtonEl.href = '/games/inverted-snakedle/';
            backNavButtonEl.textContent = '← Return to Menu';
            if (calendarNavButtonEl) {
                calendarNavButtonEl.href = 'inverted-snakedle-calendar.html';
            }
        }

        updateBackButtonForHash(window.location.hash);
        window.addEventListener('hashchange', () => updateBackButtonForHash(window.location.hash));

        dailyLabelEl.textContent = `Inverted Snakedle Day ${dayNumber}`;
        applyDailyParameters(dailyParameters);

        let puzzle = null;
        let playbackFrames = [];
        let playbackTimer = null;
        let autoSubmitTimer = null;
        let isSubmitting = false;
        let isGeneratingPuzzle = false;
        let moveLimit = GRID_SIZE * GRID_SIZE;
        let maxCollectableFruits = FRUIT_COUNT;
        let optimalMoves = { count: Infinity, moves: [] };

        function setGenerationOverlay(active, generationStartMs = null, reason = 'Generating map...') {
            generationOverlayEl.style.display = active ? 'flex' : 'none';
            generationMessageEl.textContent = reason;
            const elapsedMs = generationStartMs === null ? 0 : Math.max(0, performance.now() - generationStartMs);
            const clampedElapsedMs = Math.min(elapsedMs, MAX_GEN_TIME_MS);
            generationProgressEl.textContent = `Time: ${(clampedElapsedMs / 1000).toFixed(2)}s / ${(MAX_GEN_TIME_MS / 1000).toFixed(2)}s`;
        }

        function setControlsDisabled(disabled) {
            document.querySelectorAll('[data-dir]').forEach(btn => {
                btn.disabled = disabled;
            });
            document.getElementById('submit-snakedle').disabled = disabled;
            undoButton.disabled = disabled;
            clearButton.disabled = disabled;
        }

        function yieldToUi() {
            return new Promise(resolve => setTimeout(resolve, 0));
        }

        async function initializeGame() {
            await Promise.all([loadSelectedDayParams(), loadPreloadedDailies()]);
            dailyParameters = pickConstrainedParameters(dayNumber, DAILY_PARAMETER_LIMITS);
            if (queryDailyParameterOverride) {
                dailyParameters = queryDailyParameterOverride;
            }
            applyDailyParameters(dailyParameters);
            moveLimit = GRID_SIZE * GRID_SIZE;
            maxCollectableFruits = FRUIT_COUNT;
            rebuildMoveGrid(moveLimit);

            isGeneratingPuzzle = true;
            setControlsDisabled(true);
            setGenerationOverlay(true, performance.now(), 'Generating daily map...');
            try {
                puzzle = await generateDailyPuzzle(dayNumber);
                if (puzzle.optimalMoves && Number.isFinite(puzzle.optimalMoves.count)) {
                    optimalMoves = puzzle.optimalMoves;
                }
                moveLimit = puzzle.moveLimit || GRID_SIZE * GRID_SIZE;
                maxCollectableFruits = puzzle.maxCollectableFruits ?? FRUIT_COUNT;
                rebuildMoveGrid(moveLimit);
            } finally {
                isGeneratingPuzzle = false;
                setGenerationOverlay(false, null, 'Generating daily map...');
                setControlsDisabled(false);
            }

            refreshMoveGrid();
            refreshPlayback();
        }

        function rebuildMoveGrid(limit) {
            moveGridEl.innerHTML = '';
            moveCells.length = 0;
            for (let i = 0; i < limit; i++) {
                const cell = document.createElement('div');
                cell.className = 'move-cell';
                moveGridEl.appendChild(cell);
                moveCells.push(cell);
            }
        }

        function getDayNumber(date) {
            // Convert the current date to Paris time
            const parisTime = new Date(date.toLocaleString('en-US', { timeZone: 'Europe/Paris' }));
            const todayParis = Date.UTC(parisTime.getFullYear(), parisTime.getMonth(), parisTime.getDate());
            return Math.max(1, Math.floor((todayParis - LAUNCH_DAY_UTC) / 86400000) + 1);
        }

        function parseDayFromHash(hash) {
            const token = hash.replace(/^#/, '').trim();
            if (!token) {
                return null;
            }
            const plainMatch = token.match(/^(\d+)$/);
            if (plainMatch) {
                return { dayNumber: Number(plainMatch[1]), isAdmin: false };
            }
            const adminMatch = token.match(/^admin-(\d+)$/i);
            if (adminMatch) {
                return { dayNumber: Number(adminMatch[1]), isAdmin: true };
            }
            return null;
        }

        function resolveRequestedDay(hash, today) {
            const parsed = parseDayFromHash(hash);
            if (!parsed || !Number.isInteger(parsed.dayNumber) || parsed.dayNumber < 1) {
                return { dayNumber: today, isAdminPreviewDay: false };
            }
            if (parsed.dayNumber > today && !parsed.isAdmin) {
                return { dayNumber: today, isAdminPreviewDay: false };
            }
            return {
                dayNumber: parsed.dayNumber,
                isAdminPreviewDay: parsed.isAdmin && parsed.dayNumber > today
            };
        }

        function normalizeSelectedDayParams(raw) {
            const source = raw && typeof raw === 'object' && raw.snakedle && typeof raw.snakedle === 'object'
                ? raw.snakedle
                : raw;
            const normalized = {};
            if (!source || typeof source !== 'object') {
                return normalized;
            }
            Object.entries(source).forEach(([dayKey, params]) => {
                const day = Number(dayKey);
                if (!Number.isInteger(day) || day < 1 || !params || typeof params !== 'object') {
                    return;
                }
                const mapSize = Number(params.mapSize);
                const fruitCount = Number(params.fruitCount);
                const wallCount = Number(params.wallCount);
                if (!Number.isFinite(mapSize) || !Number.isFinite(fruitCount) || !Number.isFinite(wallCount)) {
                    return;
                }
                normalized[day] = { mapSize, fruitCount, wallCount };
            });
            return normalized;
        }

        function normalizeGridPoint(value) {
            if (Array.isArray(value) && value.length >= 2) {
                const x = Number(value[0]);
                const y = Number(value[1]);
                if (Number.isInteger(x) && Number.isInteger(y)) {
                    return { x, y };
                }
            }

            if (typeof value === 'string') {
                const match = value.trim().match(/^(\d+)\s*,\s*(\d+)$/);
                if (match) {
                    return { x: Number(match[1]), y: Number(match[2]) };
                }
            }

            if (value && typeof value === 'object') {
                const x = Number(value.x);
                const y = Number(value.y);
                if (Number.isInteger(x) && Number.isInteger(y)) {
                    return { x, y };
                }
            }

            return null;
        }

        function normalizePointList(value) {
            if (!Array.isArray(value)) {
                return null;
            }

            const normalized = [];
            for (const item of value) {
                const point = normalizeGridPoint(item);
                if (!point || !inBounds(point.x, point.y)) {
                    return null;
                }
                normalized.push(point);
            }

            return normalized;
        }

        function normalizeMoveList(value) {
            if (typeof value === 'string') {
                return value.split('').filter(move => DIRS[move]);
            }
            if (!Array.isArray(value)) {
                return null;
            }

            const normalized = [];
            for (const item of value) {
                if (typeof item !== 'string') {
                    return null;
                }
                const move = item.toUpperCase();
                if (!DIRS[move]) {
                    return null;
                }
                normalized.push(move);
            }
            return normalized;
        }

        function normalizeOptimalMoveCount(entry, mapState) {
            const source = entry && entry.optimalMoves && typeof entry.optimalMoves === 'object'
                ? entry.optimalMoves
                : mapState && mapState.optimalMoves && typeof mapState.optimalMoves === 'object'
                    ? mapState.optimalMoves
                    : null;

            if (source && Number.isFinite(Number(source.count))) {
                return Number(source.count);
            }

            if (entry && Number.isFinite(Number(entry.optimalMoveCount))) {
                return Number(entry.optimalMoveCount);
            }

            return null;
        }

        function normalizePreloadedMapEntry(entry) {
            if (!entry || typeof entry !== 'object') {
                return null;
            }

            const mapState = entry.mapState && typeof entry.mapState === 'object'
                ? entry.mapState
                : entry;
            const snakeStart = normalizePointList(mapState.snakeStart);
            const fruits = normalizePointList(mapState.fruits);
            const walls = normalizePointList(mapState.walls || []);
            if (!snakeStart || snakeStart.length < 2 || !fruits || !walls) {
                return null;
            }

            const optimalCount = normalizeOptimalMoveCount(entry, mapState);
            if (!Number.isFinite(optimalCount)) {
                return null;
            }

            const optimalMovesSource = entry.optimalMoves && typeof entry.optimalMoves === 'object'
                ? entry.optimalMoves
                : mapState.optimalMoves;
            const optimalMoveList = normalizeMoveList(optimalMovesSource.moves);

            return {
                snakeStart,
                fruits,
                walls,
                optimalMoves: {
                    count: optimalCount,
                    moves: optimalMoveList || []
                }
            };
        }

        function normalizePreloadedMapByDay(raw) {
            const source = raw && typeof raw === 'object' && raw[PRELOADED_MAP_GAME_KEY] && typeof raw[PRELOADED_MAP_GAME_KEY] === 'object'
                ? raw[PRELOADED_MAP_GAME_KEY]
                : raw;
            const normalized = {};
            if (!source || typeof source !== 'object') {
                return normalized;
            }

            Object.entries(source).forEach(([dayKey, entry]) => {
                const day = Number(dayKey);
                if (!Number.isInteger(day) || day < 1) {
                    return;
                }
                const normalizedEntry = normalizePreloadedMapEntry(entry);
                if (!normalizedEntry) {
                    return;
                }
                normalized[day] = normalizedEntry;
            });

            return normalized;
        }

        function normalizePreloadedMetaEntry(entry) {
            if (!entry || typeof entry !== 'object') {
                return null;
            }

            const moveLimitValue = Number(entry.moveLimit);
            const maxCollectableValue = Number(entry.maxCollectableFruits);
            const optimalCount = normalizeOptimalMoveCount(entry, entry.mapState);

            const hasMoveLimit = Number.isFinite(moveLimitValue);
            const hasMaxCollectable = Number.isFinite(maxCollectableValue);
            const hasOptimalCount = Number.isFinite(optimalCount);
            if (!hasMoveLimit && !hasMaxCollectable && !hasOptimalCount) {
                return null;
            }

            return {
                moveLimit: hasMoveLimit ? moveLimitValue : null,
                maxCollectableFruits: hasMaxCollectable ? maxCollectableValue : null,
                optimalMoveCount: hasOptimalCount ? optimalCount : null
            };
        }

        function normalizePreloadedMetaByDay(raw) {
            const source = raw && typeof raw === 'object' && raw[PRELOADED_META_GAME_KEY] && typeof raw[PRELOADED_META_GAME_KEY] === 'object'
                ? raw[PRELOADED_META_GAME_KEY]
                : null;
            const normalized = {};
            if (!source || typeof source !== 'object') {
                return normalized;
            }

            Object.entries(source).forEach(([dayKey, entry]) => {
                const day = Number(dayKey);
                if (!Number.isInteger(day) || day < 1) {
                    return;
                }
                const normalizedEntry = normalizePreloadedMetaEntry(entry);
                if (!normalizedEntry) {
                    return;
                }
                normalized[day] = normalizedEntry;
            });

            return normalized;
        }

        async function loadPreloadedDailies() {

        function getPreloadedPuzzle(day) {
            const preloadedMap = preloadedMapByDay[day];
            if (!preloadedMap) {

            const preloadedMeta = preloadedMetaByDay[day] || {};
            const mapWallsSet = new Set(preloadedMap.walls.map(wall => cellKey(wall.x, wall.y)));

            const mapSnakeStartList = preloadedMap.snakeStart.map(segment => ({ x: segment.x, y: segment.y }));

                : findMaxCollectableFruits(

                    },

            const effectiveOptimalCount = Number.isFinite(preloadedMeta.optimalMoveCount)

            return {

                },

        function logPreloadedDailyExport(day, dailyPuzzle) {

        async function loadSelectedDayParams() {
            try {
                const response = await fetch(SELECTED_DAY_PARAMS_URL, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`Failed to fetch selected day params: ${response.status}`);
                }
                const data = await response.json();
                selectedDayParamsByDay = normalizeSelectedDayParams(data);
            } catch (error) {
                console.warn('Could not load selected day params file. Falling back to generated params.', error);
                selectedDayParamsByDay = {};
            }
        }

        function isValidParameterSet(mapSize, fruitCount, wallCount) {
            if (mapSize < 7 || mapSize > 10) {
                return false;
            }
            if (fruitCount < 8 || fruitCount > 13) {
                return false;
            }
            if (wallCount < 10 || wallCount > 30) {
                return false;
            }
            if (mapSize + fruitCount > 20) {
                return false;
            }
            return fruitCount + wallCount <= (mapSize * mapSize) / 2;
        }

        function getAllConstrainedParameterSets(limits) {
            const sets = [];
            for (let mapSize = limits.mapSize.min; mapSize <= limits.mapSize.max; mapSize++) {
                for (let fruitCount = limits.fruitCount.min; fruitCount <= limits.fruitCount.max; fruitCount++) {
                    for (let wallCount = limits.wallCount.min; wallCount <= limits.wallCount.max; wallCount++) {
                        if (!isValidParameterSet(mapSize, fruitCount, wallCount)) {
                            continue;
                        }

                        sets.push({ mapSize, fruitCount, wallCount });
                    }
                }
            }

            return sets;
        }

        function pickConstrainedParameters(seed, limits) {
            if (selectedDayParamsByDay[seed]) {
                const params = selectedDayParamsByDay[seed];
                if (isValidParameterSet(params.mapSize, params.fruitCount, params.wallCount)) {
                    return params;
                } else {
                    console.warn(`Selected parameters for day ${seed} are invalid. Falling back to random selection.`);
                }
            }
            const sets = getAllConstrainedParameterSets(limits);
            if (sets.length === 0) {
                throw new Error('No valid parameter sets found for the provided limits.');
            }

            const rng = mulberry32((seed * 1013904223) >>> 0);
            return sets[Math.floor(rng() * sets.length)];
        }

        function mulberry32(seed) {
            let t = seed >>> 0;
            return function () {
                t += 0x6D2B79F5;
                let r = Math.imul(t ^ (t >>> 15), 1 | t);
                r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
                return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
            };
        }

        function cellKey(x, y) {
            return `${x},${y}`;
        }

        function parseKey(key) {
            const [x, y] = key.split(',').map(Number);
            return { x, y };
        }

        function inBounds(x, y) {
            return x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE;
        }

        function pickRandom(list, rng) {
            return list[Math.floor(rng() * list.length)];
        }

        function shuffled(list, rng) {
            const arr = list.slice();
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(rng() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function encodeBodyShapePacked(body, width) {
            const length = body.length;
            if (length <= 1) {
                return (1 << 28) >>> 0;
            }

            let packed = 0;
            for (let i = 0; i < length - 1; i++) {
                const current = body[i];
                const next = body[i + 1];
                const diff = next - current;

                let code = 0;
                if (diff === -width) code = 0;
                else if (diff === 1) code = 1;
                else if (diff === width) code = 2;
                else if (diff === -1) code = 3;

                packed |= (code << (i * 2));
            }

            return (((length & 0x0f) << 28) | packed) >>> 0;
        }

        function reconstructMoves(states, stateIndex, lastMove) {
            const reversed = [lastMove];
            let cursor = stateIndex;
            while (cursor >= 0) {
                const state = states[cursor];
                if (state.move) {
                    reversed.push(state.move);
                }
                cursor = state.parent;
            }
            reversed.reverse();
            return reversed;
        }

        function findOptimalMoves(candidate, maxSearch = MAX_SEARCH) {
            const totalCells = GRID_SIZE * GRID_SIZE;
            const wallBlocked = new Uint8Array(totalCells);
            for (const wallKey of candidate.walls) {
                const wall = parseKey(wallKey);
                wallBlocked[wall.y * GRID_SIZE + wall.x] = 1;
            }

            const fruitAtCell = new Int16Array(totalCells);
            fruitAtCell.fill(-1);
            candidate.fruits.forEach((fruit, i) => {
                fruitAtCell[fruit.y * GRID_SIZE + fruit.x] = i;
            });

            const targetMask = (1 << candidate.fruits.length) - 1;

            const nextUp = new Int16Array(totalCells);
            const nextRight = new Int16Array(totalCells);
            const nextDown = new Int16Array(totalCells);
            const nextLeft = new Int16Array(totalCells);
            nextUp.fill(-1);
            nextRight.fill(-1);
            nextDown.fill(-1);
            nextLeft.fill(-1);

            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const idx = y * GRID_SIZE + x;
                    if (y > 0) nextUp[idx] = idx - GRID_SIZE;
                    if (x < GRID_SIZE - 1) nextRight[idx] = idx + 1;
                    if (y < GRID_SIZE - 1) nextDown[idx] = idx + GRID_SIZE;
                    if (x > 0) nextLeft[idx] = idx - 1;
                }
            }

            const nextByDir = [nextUp, nextRight, nextDown, nextLeft];
            const dirChars = ['U', 'R', 'D', 'L'];

            const startBody = candidate.snakeStart.map(c => c.y * GRID_SIZE + c.x);
            const states = [{
                body: startBody,
                mask: 0,
                steps: 0,
                parent: -1,
                move: ''
            }];
            const queue = [0];
            let queueIndex = 0;

            const visitedByHeadMask = new Map();
            const startHeadMaskKey = (startBody[0] | (0 << 8)) >>> 0;
            visitedByHeadMask.set(startHeadMaskKey, new Set([encodeBodyShapePacked(startBody, GRID_SIZE)]));
            let searchCount = 0;

            while (queueIndex < queue.length && searchCount < maxSearch) {
                searchCount++;
                if (searchCount % 50000 === 0) {
                    //console.log(`Searched ${searchCount} / ${maxSearch} states so far...`);
                }
                const stateIndex = queue[queueIndex++];
                const state = states[stateIndex];

                for (let dirIndex = 0; dirIndex < 4; dirIndex++) {
                    const next = advanceStatePacked(state.body, state.mask, dirIndex, nextByDir, wallBlocked, fruitAtCell);
                    if (!next.valid) {
                        continue;
                    }

                    if (next.mask === targetMask) {
                        return {
                            count: state.steps + 1,
                            moves: reconstructMoves(states, stateIndex, dirChars[dirIndex])
                        };
                    }

                    const headMaskKey = (next.body[0] | (next.mask << 8)) >>> 0;
                    const bodyShapeKey = encodeBodyShapePacked(next.body, GRID_SIZE);
                    const seenShapes = visitedByHeadMask.get(headMaskKey);
                    if (!seenShapes) {
                        visitedByHeadMask.set(headMaskKey, new Set([bodyShapeKey]));
                    } else if (seenShapes.has(bodyShapeKey)) {
                        continue;
                    } else {
                        seenShapes.add(bodyShapeKey);
                    }

                    states.push({
                        body: next.body,
                        mask: next.mask,
                        steps: state.steps + 1,
                        parent: stateIndex,
                        move: dirChars[dirIndex]
                    });
                    queue.push(states.length - 1);
                }
            }

            return { count: Infinity, moves: [] };
        }

        function findMaxCollectableFruits(candidate, maxMoves, maxSearch = MAX_SEARCH) {
            const totalCells = GRID_SIZE * GRID_SIZE;
            const wallBlocked = new Uint8Array(totalCells);
            for (const wallKey of candidate.walls) {
                const wall = parseKey(wallKey);
                wallBlocked[wall.y * GRID_SIZE + wall.x] = 1;
            }

            const fruitAtCell = new Int16Array(totalCells);
            fruitAtCell.fill(-1);
            candidate.fruits.forEach((fruit, i) => {
                fruitAtCell[fruit.y * GRID_SIZE + fruit.x] = i;
            });

            const nextUp = new Int16Array(totalCells);
            const nextRight = new Int16Array(totalCells);
            const nextDown = new Int16Array(totalCells);
            const nextLeft = new Int16Array(totalCells);
            nextUp.fill(-1);
            nextRight.fill(-1);
            nextDown.fill(-1);
            nextLeft.fill(-1);

            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const idx = y * GRID_SIZE + x;
                    if (y > 0) nextUp[idx] = idx - GRID_SIZE;
                    if (x < GRID_SIZE - 1) nextRight[idx] = idx + 1;
                    if (y < GRID_SIZE - 1) nextDown[idx] = idx + GRID_SIZE;
                    if (x > 0) nextLeft[idx] = idx - 1;
                }
            }

            const nextByDir = [nextUp, nextRight, nextDown, nextLeft];
            const startBody = candidate.snakeStart.map(c => c.y * GRID_SIZE + c.x);
            const startShape = encodeBodyShapePacked(startBody, GRID_SIZE);
            const startKey = `${0}|${startBody[0]}|${startShape}`;

            const queue = [{
                body: startBody,
                mask: 0,
                steps: 0
            }];
            let queueIndex = 0;
            const bestStepsByState = new Map();
            bestStepsByState.set(startKey, 0);
            let bestFruits = 0;
            let searchCount = 0;

            while (queueIndex < queue.length && searchCount < maxSearch) {
                searchCount++;
                if (searchCount % 50000 === 0) {
                    //console.log(`Searched ${searchCount} / ${maxSearch} states for max fruits...`);
                }
                const state = queue[queueIndex++];
                bestFruits = Math.max(bestFruits, countBits(state.mask));
                if (state.steps >= maxMoves) {
                    continue;
                }

                for (let dirIndex = 0; dirIndex < 4; dirIndex++) {
                    const next = advanceStatePacked(state.body, state.mask, dirIndex, nextByDir, wallBlocked, fruitAtCell);
                    if (!next.valid) {
                        continue;
                    }

                    const nextSteps = state.steps + 1;
                    const nextShape = encodeBodyShapePacked(next.body, GRID_SIZE);
                    const nextKey = `${next.mask}|${next.body[0]}|${nextShape}`;
                    const recordedSteps = bestStepsByState.get(nextKey);
                    if (recordedSteps !== undefined && recordedSteps <= nextSteps) {
                        continue;
                    }

                    bestStepsByState.set(nextKey, nextSteps);
                    queue.push({
                        body: next.body,
                        mask: next.mask,
                        steps: nextSteps
                    });
                }
            }

            return bestFruits;
        }

        async function generateDailyPuzzle(day) {
            const preloadedPuzzle = getPreloadedPuzzle(day);
            if (preloadedPuzzle) {
                return preloadedPuzzle;
            }

            const baseSeed = day * 2654435761;
            const allCells = [];
            const generationStartMs = performance.now();
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    allCells.push(cellKey(x, y));
                }
            }
            const rng = mulberry32((baseSeed * 1013904223) >>> 0);
            const headKey = pickRandom(allCells, rng);
            const head = parseKey(headKey);
            const neighbors = DIR_ORDER
                .map(d => ({ x: head.x + DIRS[d].x, y: head.y + DIRS[d].y }))
                .filter(c => inBounds(c.x, c.y));
            const tail = pickRandom(neighbors, rng);
            const snakeStartKeys = new Set([headKey, cellKey(tail.x, tail.y)]);

            const openAfterSnake = allCells.filter(k => !snakeStartKeys.has(k));
            const fruitPool = shuffled(openAfterSnake, rng);
            const fruits = fruitPool.slice(0, FRUIT_COUNT).map(parseKey);

            for (let attempt = 0; attempt < MAX_GEN_ATTEMPTS; attempt++) {
                const attemptNumber = attempt + 1;
                if (attempt % GENERATION_PROGRESS_UPDATE_EVERY === 0) {
                    setGenerationOverlay(true, generationStartMs, 'Generating daily map...');
                    await yieldToUi();
                }
                if (performance.now() - generationStartMs > MAX_GEN_TIME_MS) {
                    console.warn(`Daily generation timeout after ${MAX_GEN_TIME_MS}ms at attempt ${attemptNumber}. Falling back.`);
                    break;
                }
                const attemptRng = mulberry32(((baseSeed + attempt) * 1013904223) >>> 0);
                const fruitKeys = new Set(fruits.map(f => cellKey(f.x, f.y)));
                const wallPool = openAfterSnake.filter(k => !fruitKeys.has(k));
                const wallSet = new Set(shuffled(wallPool, attemptRng).slice(0, WALL_COUNT));

                const candidate = {
                    walls: wallSet,
                    fruits,
                    snakeStart: [head, tail]
                };
                const optimal = findOptimalMoves(candidate, MAX_SEARCH);
                if (!Number.isFinite(optimal.count)) {
                    continue;
                }

                const budgetRng = mulberry32(((baseSeed ^ 0x9e3779b9) * 1013904223) >>> 0);
                const maxReduction = Math.floor(optimal.count / 2);
                const reduction = maxReduction > 0 ? Math.floor(budgetRng() * (maxReduction + 1)) : 0;
                const allowedMoves = Math.max(0, optimal.count - reduction);
                const maxCollectable = reduction === 0
                    ? FRUIT_COUNT
                    : findMaxCollectableFruits(candidate, allowedMoves, MAX_SEARCH);

                const dailyPuzzle = {
                    ...candidate,
                    optimalMoves: optimal,
                    moveLimit: allowedMoves,
                    maxCollectableFruits: maxCollectable
                };
                logPreloadedDailyExport(day, dailyPuzzle);
                return dailyPuzzle;
            }

            const fallbackCandidate = {
                walls: new Set(),
                fruits: [{ x: 1, y: 1 }, { x: 4, y: 1 }, { x: 1, y: 4 }, { x: 2, y: 3 }, { x: 3, y: 3 }, { x: 4, y: 4 }],
                snakeStart: [{ x: 0, y: 1 }, { x: 0, y: 0 }]
            };
            const fallbackOptimal = findOptimalMoves(fallbackCandidate, MAX_SEARCH);
            const fallbackLimit = Number.isFinite(fallbackOptimal.count) ? fallbackOptimal.count : GRID_SIZE * GRID_SIZE;
            const fallbackCollectable = Number.isFinite(fallbackOptimal.count)
                ? FRUIT_COUNT
                : findMaxCollectableFruits(fallbackCandidate, fallbackLimit, MAX_SEARCH);
            await yieldToUi();
            const fallbackPuzzle = {
                ...fallbackCandidate,
                optimalMoves: fallbackOptimal,
                moveLimit: fallbackLimit,
                maxCollectableFruits: fallbackCollectable
            };
            logPreloadedDailyExport(day, fallbackPuzzle);
            return fallbackPuzzle;
        }

        function advanceStatePacked(body, mask, dirIndex, nextByDir, wallBlocked, fruitAtCell) {
            const nextHead = nextByDir[dirIndex][body[0]];
            if (nextHead < 0 || wallBlocked[nextHead]) {
                return { valid: false };
            }

            const fruitAtHead = fruitAtCell[nextHead];
            const willEat = fruitAtHead >= 0 && (mask & (1 << fruitAtHead)) === 0;
            const collisionLimit = willEat ? body.length : body.length - 1;
            for (let i = 0; i < collisionLimit; i++) {
                if (body[i] === nextHead) {
                    return { valid: false };
                }
            }

            if (body.length === 2 && nextHead === body[1]) {
                return { valid: false };
            }

            const copyLength = willEat ? body.length : body.length - 1;
            const nextBody = new Array(copyLength + 1);
            nextBody[0] = nextHead;
            for (let i = 0; i < copyLength; i++) {
                nextBody[i + 1] = body[i];
            }

            let nextMask = mask;
            if (willEat) {
                nextMask |= (1 << fruitAtHead);
            }

            return { valid: true, body: nextBody, mask: nextMask };
        }

        function encodeState(body, mask) {
            const head = body[0];
            return `${mask}|${head.x},${head.y}`;
        }

        function advanceState(body, mask, dirKey, walls, fruitIndex) {
            const dir = DIRS[dirKey];
            const nextHead = { x: body[0].x + dir.x, y: body[0].y + dir.y };
            if (!inBounds(nextHead.x, nextHead.y) || walls.has(cellKey(nextHead.x, nextHead.y))) {
                return { valid: false };
            }

            const nextHeadKey = cellKey(nextHead.x, nextHead.y);
            const fruitAtHead = fruitIndex.has(nextHeadKey) ? fruitIndex.get(nextHeadKey) : -1;
            const willEat = fruitAtHead >= 0 && (mask & (1 << fruitAtHead)) === 0;
            const collisionBody = willEat ? body : body.slice(0, -1);
            if (collisionBody.some(c => c.x === nextHead.x && c.y === nextHead.y)) {
                return { valid: false };
            }

            // make sure it's invalid if the snake tries to move backward into itself, even if its size is 2 meaning that the tail would move away
            if (body.length === 2 && nextHead.x === body[1].x && nextHead.y === body[1].y) {
                return { valid: false };
            }

            const nextBody = [nextHead, ...body.map(c => ({ x: c.x, y: c.y }))];
            if (!willEat) {
                nextBody.pop();
            }

            let nextMask = mask;
            if (willEat) {
                nextMask |= (1 << fruitAtHead);
            }

            return { valid: true, body: nextBody, mask: nextMask };
        }

        function simulateMoves(moves) {
            if (!puzzle) {
                return { frames: [], state: 'running', movesUsed: 0, fruitsEaten: 0 };
            }

            const fruitIndex = new Map();
            puzzle.fruits.forEach((fruit, i) => fruitIndex.set(cellKey(fruit.x, fruit.y), i));
            const targetMask = (1 << puzzle.fruits.length) - 1;

            let body = puzzle.snakeStart.map(c => ({ x: c.x, y: c.y }));
            let mask = 0;
            const frames = [{ body: body.map(c => ({ ...c })), mask, state: 'running' }];
            let resultState = 'running';

            for (let i = 0; i < moves.length; i++) {
                const step = advanceState(body, mask, moves[i], puzzle.walls, fruitIndex);
                if (!step.valid) {
                    resultState = 'dead';
                    frames.push({ body: body.map(c => ({ ...c })), mask, state: 'dead' });
                    return { frames, state: resultState, movesUsed: i + 1, fruitsEaten: countBits(mask) };
                }
                body = step.body;
                mask = step.mask;

                if (mask === targetMask) {
                    resultState = 'win';
                    frames.push({ body: body.map(c => ({ ...c })), mask, state: 'win' });
                    return { frames, state: resultState, movesUsed: i + 1, fruitsEaten: puzzle.fruits.length };
                }

                frames.push({ body: body.map(c => ({ ...c })), mask, state: 'running' });
            }

            const outOfMoves = resultState === 'running' && moves.length >= moveLimit;
            if (outOfMoves && frames.length > 0) {
                frames[frames.length - 1].state = 'out_of_moves';
            }
            return {
                frames,
                state: resultState,
                movesUsed: moves.length,
                fruitsEaten: countBits(mask),
                outOfMoves
            };
        }

        function countBits(num) {
            let n = num;
            let count = 0;
            while (n) {
                count += n & 1;
                n >>= 1;
            }
            return count;
        }

        function refreshMoveGrid() {
            const simulation = simulateMoves(queueMoves);
            if (!puzzle) {
                for (let i = 0; i < moveCells.length; i++) {
                    const cell = moveCells[i];
                    cell.textContent = '';
                    cell.classList.remove('filled', 'crash');
                }
                return;
            }
            const crashIndex = simulation.state === 'dead' ? simulation.movesUsed - 1 : -1;
            for (let i = 0; i < moveCells.length; i++) {
                const move = queueMoves[i];
                const cell = moveCells[i];
                if (move) {
                    cell.textContent = ARROW[move];
                    cell.classList.add('filled');
                    cell.classList.toggle('crash', i === crashIndex);
                } else {
                    cell.textContent = '';
                    cell.classList.remove('filled', 'crash');
                }
            }
        }

        function drawBoard(frame) {
            ctx.fillStyle = '#0c2030';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(125, 223, 223, 0.18)';
            ctx.lineWidth = 1;
            for (let c = 0; c <= GRID_SIZE; c++) {
                ctx.beginPath();
                ctx.moveTo(c * CELL_SIZE, 0);
                ctx.lineTo(c * CELL_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let r = 0; r <= GRID_SIZE; r++) {
                ctx.beginPath();
                ctx.moveTo(0, r * CELL_SIZE);
                ctx.lineTo(canvas.width, r * CELL_SIZE);
                ctx.stroke();
            }

            for (const key of puzzle.walls) {
                const { x, y } = parseKey(key);
                const px = x * CELL_SIZE;
                const py = y * CELL_SIZE;
                ctx.fillStyle = '#24384a';
                ctx.fillRect(px + 6, py + 6, CELL_SIZE - 12, CELL_SIZE - 12);
                ctx.strokeStyle = '#3e5a71';
                ctx.lineWidth = 2;
                ctx.strokeRect(px + 6, py + 6, CELL_SIZE - 12, CELL_SIZE - 12);
            }

            const collectedMask = frame.mask;
            puzzle.fruits.forEach((fruit, index) => {
                if ((collectedMask & (1 << index)) !== 0) {
                    return;
                }
                const fx = fruit.x * CELL_SIZE + CELL_SIZE / 2;
                const fy = fruit.y * CELL_SIZE + CELL_SIZE / 2;
                const fr = CELL_SIZE * 0.22;
                ctx.fillStyle = '#e05555';
                ctx.beginPath();
                ctx.arc(fx, fy, fr, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ff9999';
                ctx.beginPath();
                ctx.arc(fx - fr * 0.35, fy - fr * 0.35, fr * 0.28, 0, Math.PI * 2);
                ctx.fill();
            });

            for (let i = frame.body.length - 1; i >= 0; i--) {
                const segment = frame.body[i];
                const x = segment.x * CELL_SIZE;
                const y = segment.y * CELL_SIZE;
                const pad = 6;
                const size = CELL_SIZE - pad * 2;
                const radius = 12;
                ctx.fillStyle = i === 0 ? '#7ddfdf' : '#126364';
                ctx.strokeStyle = '#0a4a4a';
                ctx.lineWidth = 2;

                roundRect(ctx, x + pad, y + pad, size, size, radius);
                ctx.fill();
                ctx.stroke();
            }

            if (frame.body.length > 0) {
                const head = frame.body[0];
                const neck = frame.body[1];
                let dx = 1;
                let dy = 0;
                if (neck) {
                    dx = head.x - neck.x;
                    dy = head.y - neck.y;
                }

                const headX = head.x * CELL_SIZE;
                const headY = head.y * CELL_SIZE;
                const eyeR = CELL_SIZE * 0.11;

                let eye1 = [headX + CELL_SIZE * 0.28, headY + CELL_SIZE * 0.3];
                let eye2 = [headX + CELL_SIZE * 0.72, headY + CELL_SIZE * 0.3];
                if (dx > 0) {
                    eye1 = [headX + CELL_SIZE * 0.68, headY + CELL_SIZE * 0.3];
                    eye2 = [headX + CELL_SIZE * 0.68, headY + CELL_SIZE * 0.7];
                } else if (dx < 0) {
                    eye1 = [headX + CELL_SIZE * 0.32, headY + CELL_SIZE * 0.3];
                    eye2 = [headX + CELL_SIZE * 0.32, headY + CELL_SIZE * 0.7];
                } else if (dy > 0) {
                    eye1 = [headX + CELL_SIZE * 0.3, headY + CELL_SIZE * 0.68];
                    eye2 = [headX + CELL_SIZE * 0.7, headY + CELL_SIZE * 0.68];
                }

                ctx.fillStyle = '#042223';
                ctx.beginPath();
                ctx.arc(eye1[0], eye1[1], eyeR, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(eye2[0], eye2[1], eyeR, 0, Math.PI * 2);
                ctx.fill();
            }

            if (frame.state === 'dead' || frame.state === 'out_of_moves') {
                ctx.fillStyle = 'rgba(224, 85, 85, 0.28)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function roundRect(context, x, y, w, h, r) {
            context.beginPath();
            context.moveTo(x + r, y);
            context.lineTo(x + w - r, y);
            context.quadraticCurveTo(x + w, y, x + w, y + r);
            context.lineTo(x + w, y + h - r);
            context.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            context.lineTo(x + r, y + h);
            context.quadraticCurveTo(x, y + h, x, y + h - r);
            context.lineTo(x, y + r);
            context.quadraticCurveTo(x, y, x + r, y);
            context.closePath();
        }

        function refreshPlayback() {
            if (playbackTimer) {
                clearInterval(playbackTimer);
                playbackTimer = null;
            }

            if (!puzzle) {
                statusLineEl.textContent = isGeneratingPuzzle
                    ? 'Generating daily map...'
                    : 'Map unavailable.';
                fruitProgressEl.textContent = `Fruits: 0 / ${FRUIT_COUNT}`;
                moveProgressEl.textContent = 'Moves: 0 / --';
                return;
            }

            const simulation = simulateMoves(queueMoves);
            playbackFrames = simulation.frames;
            fruitProgressEl.textContent = `Fruits: ${simulation.fruitsEaten} / ${FRUIT_COUNT}`;
            moveProgressEl.textContent = `Moves: ${queueMoves.length} / ${moveLimit}`;
            drawBoard(playbackFrames[playbackFrames.length - 1]);
            if (autoSubmitTimer) {
                clearTimeout(autoSubmitTimer);
                autoSubmitTimer = null;
            }
            if (queueMoves.length === 0) {
                statusLineEl.textContent = 'Use the buttons or arrow keys to queue moves.';
                return;
            }
            if (simulation.state === 'dead') {
                statusLineEl.textContent = 'Route crashes. Submit to score this run or edit it.';
            } else if (simulation.state === 'win') {
                statusLineEl.textContent = 'All visible fruits collected. Submit or refine your route.';
            } else if (queueMoves.length >= moveLimit) {
                statusLineEl.textContent = 'Move limit reached. Submit your run or edit it.';
            } else {
                const last = queueMoves[queueMoves.length - 1];
                statusLineEl.textContent = `Queued move ${queueMoves.length}: ${ARROW[last]}`;
            }
        }

        function playSubmissionAnimation(simulation, onDone) {
            if (playbackTimer) {
                clearInterval(playbackTimer);
                playbackTimer = null;
            }
            playbackFrames = simulation.frames;
            let frameIndex = 0;
            drawBoard(playbackFrames[frameIndex]);
            if (playbackFrames.length <= 1) {
                onDone();
                return;
            }
            playbackTimer = setInterval(() => {
                frameIndex += 1;
                drawBoard(playbackFrames[Math.min(frameIndex, playbackFrames.length - 1)]);
                if (frameIndex >= playbackFrames.length - 1) {
                    clearInterval(playbackTimer);
                    playbackTimer = null;
                    onDone();
                }
            }, FRAME_DURATION_MS);
        }

        function getCurrentHeadingDir() {
            return getHeadingDirForMoves(queueMoves);
        }

        function getHeadingDirForMoves(moves) {
            if (moves.length > 0) {
                return moves[moves.length - 1];
            }
            const [head, neck] = puzzle.snakeStart;
            const dx = head.x - neck.x;
            const dy = head.y - neck.y;
            if (dx === 1) return 'R';
            if (dx === -1) return 'L';
            if (dy === 1) return 'D';
            return 'U';
        }

        function getFruitIndexMap() {
            const fruitIndex = new Map();
            puzzle.fruits.forEach((fruit, i) => fruitIndex.set(cellKey(fruit.x, fruit.y), i));
            return fruitIndex;
        }

        function tryReplaceCrashMove(dirKey) {
            if (queueMoves.length === 0) {
                return false;
            }

            const candidateMoves = queueMoves.slice(0, -1);
            const heading = getHeadingDirForMoves(candidateMoves);
            if (dirKey === OPPOSITE[heading]) {
                return false;
            }

            const simulationBeforeCrashMove = simulateMoves(candidateMoves);
            if (!simulationBeforeCrashMove.frames.length || simulationBeforeCrashMove.state === 'dead') {
                return false;
            }

            const lastFrame = simulationBeforeCrashMove.frames[simulationBeforeCrashMove.frames.length - 1];
            const body = lastFrame.body.map(c => ({ ...c }));
            const fruitIndex = getFruitIndexMap();
            const step = advanceState(body, lastFrame.mask, dirKey, puzzle.walls, fruitIndex);
            if (!step.valid) {
                return false;
            }

            queueMoves.splice(0, queueMoves.length, ...candidateMoves, dirKey);
            return true;
        }

        function addMove(dirKey) {
            if (isGeneratingPuzzle || !puzzle) return;
            const currentSimulation = simulateMoves(queueMoves);
            if (currentSimulation.state === 'dead') {
                if (tryReplaceCrashMove(dirKey)) {
                    refreshMoveGrid();
                    refreshPlayback();
                } else {
                    statusLineEl.textContent = 'Route already crashes. Undo or clear to continue.';
                }
                return;
            }
            if (currentSimulation.state === 'win') {
                statusLineEl.textContent = 'All fruits are already collected. Submit your run or edit it.';
                return;
            }
            if (queueMoves.length >= moveLimit) {
                statusLineEl.textContent = `Move queue is full (${moveLimit}). Submit, undo, or clear.`;
                return;
            }
            const heading = getCurrentHeadingDir();
            if (dirKey === OPPOSITE[heading]) {
                statusLineEl.textContent = 'Cannot reverse directly into the snake.';
                return;
            }
            queueMoves.push(dirKey);
            refreshMoveGrid();
            refreshPlayback();
        }

        function undoMove() {
            if (queueMoves.length === 0) {
                return;
            }
            queueMoves.pop();
            refreshMoveGrid();
            refreshPlayback();
        }

        function clearMoves() {
            queueMoves.length = 0;
            refreshMoveGrid();
            refreshPlayback();
        }

        function performanceEmoji(fruits, total) {
            if (fruits > total) return '🟪'; //normally impossible, just in case
            if (fruits == total) return '🟦';
            if (fruits >= total-1) return '🟩';
            if (fruits >= total-2) return '🟨';
            if (fruits >= total-3) return '🟧';
            return '🟥';
        }
        function submitRun(isAuto = false) {
            if (isGeneratingPuzzle || !puzzle) {
                statusLineEl.textContent = 'Please wait for map generation to finish.';
                return;
            }
            if (isSubmitting) {
                return;
            }
            if (queueMoves.length === 0) {
                statusLineEl.textContent = 'Queue at least one move before submitting.';
                return;
            }
            if (autoSubmitTimer) {
                clearTimeout(autoSubmitTimer);
                autoSubmitTimer = null;
            }
            const simulation = simulateMoves(queueMoves);

            setButtonsDisabledState(true); // Disable buttons during submission

            const usedMoves = simulation.movesUsed;
            const fruitsEaten = simulation.fruitsEaten;
            const emoji = performanceEmoji(fruitsEaten, maxCollectableFruits);
            const shareHash = isAdminPreviewDay ? `#admin-${dayNumber}` : `#${dayNumber}`;
            const shareUrl = dayNumber === todayDayNumber && !isAdminPreviewDay
                ? 'https://egeeken.github.io/inverted-snakedle'
                : `https://egeeken.github.io/inverted-snakedle${shareHash}`;
            const shareText = `Inverted Snakedle Day ${dayNumber}: ${fruitsEaten}/${FRUIT_COUNT} fruits in ${usedMoves}/${moveLimit} moves ${emoji}\n${shareUrl}`;
            resultsTextEl.textContent = shareText;
            statusLineEl.textContent = 'Submitting... replaying your run.';
            isSubmitting = true;
            playSubmissionAnimation(simulation, () => {
                resultsModal.style.display = 'flex';
                localStorage.setItem(
                    `inverted-snakedle-${dayNumber}`,
                    JSON.stringify({ usedMoves, fruitsEaten, fruitCount: FRUIT_COUNT, moveLimit: moveLimit, maxCollectableFruits, emoji, at: new Date().toISOString() })
                );
                isSubmitting = false;
                setButtonsDisabledState(false); // Re-enable buttons after submission
            });
        }

        // Disable undo and clear buttons during submission or animations
        const undoButton = document.getElementById('undo-move');
        const clearButton = document.getElementById('clear-moves');

        function setButtonsDisabledState(disabled) {
            undoButton.disabled = disabled;
            clearButton.disabled = disabled;
        }

        document.querySelectorAll('[data-dir]').forEach(btn => {
            btn.addEventListener('click', () => addMove(btn.dataset.dir));
        });

        undoButton.addEventListener('click', undoMove);
        clearButton.addEventListener('click', clearMoves);
        document.getElementById('submit-snakedle').addEventListener('click', () => submitRun());

        document.addEventListener('keydown', (e) => {
            const target = e.target;
            if (
                target instanceof HTMLElement &&
                (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)
            ) {
                return;
            }
            const keyMap = {
                ArrowUp: 'U',
                ArrowDown: 'D',
                ArrowLeft: 'L',
                ArrowRight: 'R',
                w: 'U',
                W: 'U',
                s: 'D',
                S: 'D',
                a: 'L',
                A: 'L',
                d: 'R',
                D: 'R'
            };
            if (keyMap[e.key]) {
                e.preventDefault();
                addMove(keyMap[e.key]);
            } else if (e.key === 'Backspace' || e.key === 'Z' || e.key === 'z') {
                e.preventDefault();
                undoMove();
            } else if (e.key === 'Escape' || e.key === 'C' || e.key === 'c') {
                e.preventDefault();
                clearMoves();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                submitRun();
            }
        });

        document.getElementById('copy-share').addEventListener('click', async () => {
            const text = resultsTextEl.textContent;
            try {
                await navigator.clipboard.writeText(text);
                statusLineEl.textContent = 'Share text copied to clipboard.';
            } catch (err) {
                const temp = document.createElement('textarea');
                temp.value = text;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
                statusLineEl.textContent = 'Share text copied to clipboard.';
            }
        });

        document.getElementById('close-results').addEventListener('click', () => {
            resultsModal.style.display = 'none';
        });

        resultsModal.addEventListener('click', (e) => {
            if (e.target === resultsModal) {
                resultsModal.style.display = 'none';
            }
        });

        function buildInvertedSnakedleDebugSnapshot() {
            if (!puzzle) {
                return null;
            }

            return {
                dayNumber,
                isAdminPreviewDay,
                parameters: {
                    mapSize: GRID_SIZE,
                    fruitCount: FRUIT_COUNT,
                    wallCount: WALL_COUNT
                },
                moveLimit,
                maxCollectableFruits,
                optimalMoveCount: Number.isFinite(optimalMoves?.count) ? optimalMoves.count : null
            };
        }

        const initializePromise = initializeGame();

        window.__invertedSnakedleDebug = {
            waitUntilReady: async () => {
                await initializePromise;
                return buildInvertedSnakedleDebugSnapshot();
            },
            getSnapshot: buildInvertedSnakedleDebugSnapshot
        };

        initializePromise.catch(err => {
            console.error('Failed to initialize Inverted Snakedle:', err);
            setGenerationOverlay(false, null, 'Generating daily map...');
            setControlsDisabled(true);
            statusLineEl.textContent = 'Could not initialize the daily puzzle.';
        });
    </script>
</body>
