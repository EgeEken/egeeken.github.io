<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/favicon.png" type="image/png">
    <title>Ege - Snakedle Admin Calendar</title>
    <style>
        #calendar-wrapper {
            width: min(1100px, 80vw);
            margin: 24px auto 40px;
            color: #eee;
        }

        #calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
            gap: 12px;
        }

        .day-button {
            aspect-ratio: 1;
            border: none;
            border-radius: 10px;
            background: #8f1f1f;
            color: #fff;
            font-family: 'Futura', sans-serif;
            font-weight: 700;
            font-size: clamp(1.05rem, 2.4vw, 1.5rem);
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(143, 31, 31, 0.45);
            transition: transform 0.12s, background-color 0.2s;
        }

        .day-button:hover {
            background: #b52a2a;
            transform: scale(1.03);
        }

        .calendar-empty {
            text-align: center;
            color: #f2d8d8;
            opacity: 0.9;
        }

        @media (max-width: 900px) {
            #calendar-wrapper {
                width: 94vw;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="snakedle.html" class="back-button">← Return to Daily</a>
        <h1><b>Snakedle Admin Calendar</b></h1>
    </header>

    <main id="calendar-wrapper">
        <div id="calendar-grid" aria-live="polite"></div>
    </main>

    <script>
        const DAILY_PARAMETER_LIMITS = {
            mapSize: { min: 7, max: 10 },
            fruitCount: { min: 8, max: 13 },
            wallCount: { min: 10, max: 30 }
        };
        const SELECTED_DAY_PARAMS_URL = 'assets/snakedle-selected-day-params.json';
        const MAX_ADMIN_DAY = 200;
        const gridEl = document.getElementById('calendar-grid');
        let selectedDayParamsByDay = {
            4: { mapSize: 8, fruitCount: 12, wallCount: 20 },
            5: { mapSize: 9, fruitCount: 10, wallCount: 30 },
            7: { mapSize: 8, fruitCount: 12, wallCount: 20 }
        };

        function isValidParameterSet(mapSize, fruitCount, wallCount) {
            if (mapSize < 7 || mapSize > 10) return false;
            if (fruitCount < 8 || fruitCount > 13) return false;
            if (wallCount < 10 || wallCount > 30) return false;
            if (mapSize + fruitCount > 20) return false;
            return fruitCount + wallCount <= (mapSize * mapSize) / 2;
        }

        function getAllConstrainedParameterSets(limits) {
            const sets = [];
            for (let mapSize = limits.mapSize.min; mapSize <= limits.mapSize.max; mapSize++) {
                for (let fruitCount = limits.fruitCount.min; fruitCount <= limits.fruitCount.max; fruitCount++) {
                    for (let wallCount = limits.wallCount.min; wallCount <= limits.wallCount.max; wallCount++) {
                        if (isValidParameterSet(mapSize, fruitCount, wallCount)) {
                            sets.push({ mapSize, fruitCount, wallCount });
                        }
                    }
                }
            }
            return sets;
        }

        function pickConstrainedParameters(seed, limits) {
            if (selectedDayParamsByDay[seed]) {
                const params = selectedDayParamsByDay[seed];
                if (isValidParameterSet(params.mapSize, params.fruitCount, params.wallCount)) {
                    return params;
                }
            }
            const sets = getAllConstrainedParameterSets(limits);
            const rng = mulberry32((seed * 1013904223) >>> 0);
            return sets[Math.floor(rng() * sets.length)];
        }

        function mulberry32(seed) {
            let t = seed >>> 0;
            return function () {
                t += 0x6D2B79F5;
                let r = Math.imul(t ^ (t >>> 15), 1 | t);
                r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
                return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
            };
        }

        function normalizeSelectedDayParams(raw) {
            const source = raw && typeof raw === 'object' && raw.snakedle && typeof raw.snakedle === 'object'
                ? raw.snakedle
                : raw;
            const normalized = {};
            if (!source || typeof source !== 'object') return normalized;
            Object.entries(source).forEach(([dayKey, params]) => {
                const day = Number(dayKey);
                if (!Number.isInteger(day) || day < 1 || !params || typeof params !== 'object') return;
                const mapSize = Number(params.mapSize);
                const fruitCount = Number(params.fruitCount);
                const wallCount = Number(params.wallCount);
                if (!Number.isFinite(mapSize) || !Number.isFinite(fruitCount) || !Number.isFinite(wallCount)) return;
                normalized[day] = { mapSize, fruitCount, wallCount };
            });
            return normalized;
        }

        async function loadSelectedDayParams() {
            try {
                const response = await fetch(SELECTED_DAY_PARAMS_URL, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`Failed to load day params (${response.status})`);
                }
                const data = await response.json();
                selectedDayParamsByDay = normalizeSelectedDayParams(data);
            } catch (error) {
                console.warn('Could not load selected day params file for admin calendar.', error);
                selectedDayParamsByDay = {};
            }
        }

        function renderCalendar() {
            gridEl.innerHTML = '';
            for (let day = 1; day <= MAX_ADMIN_DAY; day++) {
                const params = pickConstrainedParameters(day, DAILY_PARAMETER_LIMITS);
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'day-button';
                button.textContent = String(day);
                button.title = `Day ${day} • ${params.mapSize}x${params.mapSize}, ${params.fruitCount} fruits, ${params.wallCount} walls`;
                button.addEventListener('click', () => {
                    window.location.href = `snakedle.html#admin-${day}`;
                });
                gridEl.appendChild(button);
            }
        }

        (async function initCalendar() {
            await loadSelectedDayParams();
            renderCalendar();
        })();
    </script>
</body>
</html>
