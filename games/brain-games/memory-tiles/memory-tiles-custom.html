<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../style.css">
    <link rel="stylesheet" href="memory_tiles.css">
    <link rel="icon" href="../../../assets/favicon.png" type="image/png">
    <title>Ege - Memory Tiles (Custom)</title>
</head>

<body data-mode="custom">
    <header>
        <a href="./" class="back-button">← Return to Menu</a>
        <h1>Memory Tiles (Custom)</h1>
        <h2>Dial in the challenge you want.</h2>
    </header>

    <main id="memory-wrapper">
        <div class="memory-panel" id="level-panel">
            <div class="control-row">
                <label for="preset-level">Level Preset</label>
                <input type="range" id="preset-level" min="1" max="30" value="10" step="1">
                <span class="control-value" id="preset-level-value">10</span>
            </div>
        </div>

        <div class="memory-panel" id="controls-panel">
            <div class="control-row">
                <label for="grid-size">Matrix size</label>
                <input type="range" id="grid-size" min="3" max="8" value="3" step="1">
                <span class="control-value" id="grid-size-value">3 × 3</span>
            </div>
            <div class="control-row">
                <label for="highlight-rate">Highlighted tiles</label>
                <input type="range" id="highlight-rate" min="3" max="4" value="3" step="1">
                <span class="control-value" id="highlight-rate-value">3 tiles (33%)</span>
            </div>
            <div class="control-row">
                <label for="reveal-time">Reveal time</label>
                <input type="range" id="reveal-time" min="100" max="3000" value="500" step="50">
                <span class="control-value" id="reveal-time-value">500 ms</span>
            </div>
            <div class="control-row">
                <label for="strike-limit">Strikes</label>
                <input type="range" id="strike-limit" min="1" max="6" value="3" step="1">
                <span class="control-value" id="strike-limit-value">3</span>
            </div>
        </div>

        <div id="tiles-grid" aria-live="polite"></div>

        <div class="memory-panel" id="status-panel">
            <div id="status-line">Adjust the sliders and press restart.</div>
            <div class="memory-stat" id="strike-display">Strikes: 0 / 3</div>
            <button class="memory-button" id="restart-button">Restart</button>
        </div>
    </main>

    <script src="memory_tiles.js"></script>
</body>

</html>
