<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../style.css">
    <link rel="stylesheet" href="mouse_vertigo.css">
    <link rel="icon" href="../../../assets/favicon.png" type="image/png">
    <title>Ege - Mouse Vertigo (Custom)</title>
</head>

<body data-mode="custom">
    <header>
        <a href="./" class="back-button">← Return to Menu</a>
        <h1>Mouse Vertigo (Custom)</h1>
        <h2>Dial in the challenge you want.</h2>
    </header>

    <main id="vertigo-wrapper">
        <div class="vertigo-panel" id="level-panel">
            <div class="control-row">
                <label for="preset-level">Level preset</label>
                <input type="range" id="preset-level" min="0" max="30" value="10" step="1">
                <span class="control-value" id="preset-level-value">10</span>
            </div>
        </div>

        <div class="vertigo-panel" id="controls-panel">
            <div class="control-row">
                <label for="maze-size">Maze size</label>
                <input type="range" id="maze-size" min="5" max="9" value="6" step="1">
                <span class="control-value" id="maze-size-value">6 × 6</span>
            </div>
            <div class="control-row">
                <label for="rotation-time-min">Rotation time minimum</label>
                <input type="range" id="rotation-time-min" min="0" max="5" value="1" step="0.1">
                <span class="control-value" id="rotation-time-min-value">1.0 s</span>
            </div>
            <div class="control-row">
                <label for="rotation-intensity-min">Rotation intensity minimum</label>
                <input type="range" id="rotation-intensity-min" min="0" max="150" value="30" step="1">
                <span class="control-value" id="rotation-intensity-min-value">30°</span>
            </div>
            <div class="control-row">
                <label for="timer-leniency">Timer leniency</label>
                <input type="range" id="timer-leniency" min="0" max="100" value="30" step="1">
                <span class="control-value" id="timer-leniency-value">30%</span>
            </div>
        </div>

        <div id="maze-area">
            <div id="maze-rotation-frame">
                <div id="maze-marker" aria-hidden="true"></div>
                <div id="maze-grid" aria-live="polite"></div>
            </div>
        </div>

        <div class="vertigo-panel" id="status-panel">
            <div id="status-line">Adjust the sliders and press restart.</div>
            <div class="vertigo-stat" id="timer-display">Time: --</div>
            <div id="dpad-vertigo">
                <button class="vertigo-btn" data-dir="U" aria-label="Up">▴</button>
                <div class="dpad-row">
                    <button class="vertigo-btn" data-dir="L" aria-label="Left">◂</button>
                    <button class="vertigo-btn" data-dir="D" aria-label="Down">▾</button>
                    <button class="vertigo-btn" data-dir="R" aria-label="Right">▸</button>
                </div>
            </div>
            <button class="vertigo-button" id="restart-button">Restart</button>
        </div>
    </main>

    <div id="results-modal" role="dialog" aria-modal="true">
        <div id="results-card">
            <h3>Result</h3>
            <div id="results-text"></div>
            <div class="results-actions">
                <button id="copy-share">Copy Share Text</button>
                <button id="close-results">Close</button>
            </div>
        </div>
    </div>

    <script src="mouse_vertigo.js"></script>
</body>

</html>
