<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Cube Stack</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07090f;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #d4dcff;
    }
    #gl {
      width: 100%;
      height: 100%;
      display: block;
    }
    .back-button {
      position: fixed;
      top: 20px;
      left: 20px;
      background-color: #273a4d;
      color: #fff;
      text-decoration: none;
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 1em;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      transition: background-color 0.3s, transform 0.2s;
      z-index: 1002;
    }
    .back-button:hover {
      background-color: #126364;
      transform: translateX(-3px);
    }
    #menu-toggle {
      position: fixed;
      right: 14px;
      top: 12px;
      z-index: 1003;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(8, 12, 20, 0.78);
      color: #d4dcff;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 12px;
    }
    #menu {
      position: fixed;
      left: 14px;
      top: 68px;
      width: min(350px, calc(100vw - 28px));
      padding: 12px;
      border-radius: 10px;
      background: rgba(8, 12, 20, 0.65);
      backdrop-filter: blur(4px);
      line-height: 1.35;
      font-size: 13px;
      z-index: 1001;
      border: 1px solid rgba(255, 255, 255, 0.12);
      user-select: none;
    }
    #menu h2 {
      margin: 0 0 10px;
      font-size: 15px;
      color: #ffffff;
      font-weight: 600;
    }
    .menu-row {
      margin: 8px 0;
      display: grid;
      gap: 4px;
    }
    .menu-row label {
      font-size: 12px;
      color: #c8d4ff;
    }
    .value-row {
      display: grid;
      grid-template-columns: 1fr 74px;
      gap: 8px;
      align-items: center;
    }
    .value-row input[type="range"] {
      width: 100%;
    }
    .value-row input[type="number"] {
      width: 100%;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.24);
      color: #e8eeff;
      padding: 4px 6px;
      box-sizing: border-box;
    }
    #auto-zoom-btn {
      margin-top: 8px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      background: rgba(39, 58, 77, 0.9);
      color: #fff;
      padding: 8px 10px;
      cursor: pointer;
    }
    #auto-zoom-btn.in {
      background: rgba(18, 99, 100, 0.95);
    }
    #auto-zoom-btn.out {
      background: rgba(109, 73, 31, 0.95);
    }
    #stats {
      margin-top: 10px;
      font-size: 12px;
      color: #d8e0ff;
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>

  <a id="return-button" href="../demos.html" class="back-button">← Return to Demos</a>
  <button id="menu-toggle" type="button">Hide menu (Esc)</button>

  <div id="menu">
    <h2>Infinite Cube Stack</h2>

    <div class="menu-row">
      <label id="r-rate-label">Recursion rate (2 - 10)</label>
      <div class="value-row">
        <input id="r-rate-range" type="range" min="2" max="10" step="0.1" aria-labelledby="r-rate-label">
        <input id="r-rate-number" type="number" min="2" max="10" step="0.1" aria-labelledby="r-rate-label">
      </div>
    </div>

    <div class="menu-row">
      <label id="zoom-speed-label">Zoom speed (0.00 - 1)</label>
      <div class="value-row">
        <input id="zoom-speed-range" type="range" min="0.00" max="1" step="0.01" aria-labelledby="zoom-speed-label">
        <input id="zoom-speed-number" type="number" min="0.00" max="1" step="0.01" aria-labelledby="zoom-speed-label">
      </div>
    </div>

    <div class="menu-row">
      <label id="rotation-speed-label">Rotation speed (0.00 - 5)</label>
      <div class="value-row">
        <input id="rotation-speed-range" type="range" min="0.00" max="5" step="0.01" aria-labelledby="rotation-speed-label">
        <input id="rotation-speed-number" type="number" min="0.00" max="5" step="0.01" aria-labelledby="rotation-speed-label">
      </div>
    </div>

    <div class="menu-row">
      <label id="camera-angle-label">Camera angle (-1.5 to 1.5)</label>
      <div class="value-row">
        <input id="camera-angle-range" type="range" min="-1.5" max="1.5" step="0.01" aria-labelledby="camera-angle-label">
        <input id="camera-angle-number" type="number" min="-1.5" max="1.5" step="0.01" aria-labelledby="camera-angle-label">
      </div>
    </div>

    <div class="menu-row">
      <label id="camera-distance-label">Camera distance (0.8 - 6)</label>
      <div class="value-row">
        <input id="camera-distance-range" type="range" min="0.8" max="6" step="0.1" aria-labelledby="camera-distance-label">
        <input id="camera-distance-number" type="number" min="0.8" max="6" step="0.1" aria-labelledby="camera-distance-label">
      </div>
    </div>

    <div class="menu-row">
      <label id="auto-zoom-rate-label">Auto zoom rate (0 - 2)</label>
      <div class="value-row">
        <input id="auto-zoom-rate-range" type="range" min="0" max="2" step="0.01" aria-labelledby="auto-zoom-rate-label">
        <input id="auto-zoom-rate-number" type="number" min="0" max="2" step="0.01" aria-labelledby="auto-zoom-rate-label">
      </div>
    </div>

    <div class="menu-row">
      <label id="light-yaw-label">Light yaw (-180 to 180)</label>
      <div class="value-row">
        <input id="light-yaw-range" type="range" min="-180" max="180" step="1" aria-labelledby="light-yaw-label">
        <input id="light-yaw-number" type="number" min="-180" max="180" step="1" aria-labelledby="light-yaw-label">
      </div>
    </div>

    <div class="menu-row">
      <label id="light-pitch-label">Light pitch (-89 to 89)</label>
      <div class="value-row">
        <input id="light-pitch-range" type="range" min="-89" max="89" step="1" aria-labelledby="light-pitch-label">
        <input id="light-pitch-number" type="number" min="-89" max="89" step="1" aria-labelledby="light-pitch-label">
      </div>
    </div>

    <button id="auto-zoom-btn" type="button" aria-pressed="false">Auto zoom: OFF</button>

    <div id="stats">
      <div>Level: <span id="level-value">0.00</span></div>
      <div>FPS: <span id="fps-value">0.0</span></div>
    </div>
  </div>

  <script id="vs" type="x-shader/x-vertex">
    attribute vec2 coord;
    varying vec2 vCoord;
    void main() {
      vCoord = coord;
      gl_Position = vec4(coord, 0.0, 1.0);
    }
  </script>

  <script id="fs" type="x-shader/x-fragment">
    precision highp float;

    varying vec2 vCoord;

    uniform vec2 uResolution;
    uniform vec3 uCameraPos;
    uniform vec3 uCameraForward;
    uniform vec3 uCameraRight;
    uniform vec3 uCameraUp;
    uniform vec3 uLightPos;
    uniform vec3 uCenterLineA;
    uniform vec3 uBaseColor;
    uniform vec3 uBackground;
    uniform float uInvRate;
    uniform float uLevelBase;
    uniform float uInvWorldScaleContinuous;
    uniform float uTime;

    const float EPS = 0.0009;
    const float MAX_DIST = 90.0;
    const int MAX_STEPS = 54;
    const int MAX_SHADOW_STEPS = 16;
    const int DOWN_LEVELS = 4;
    const int UP_LEVELS = 10;

    float boxSDF(vec3 p, vec3 b) {
      vec3 q = abs(p) - b;
      return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
    }

    vec2 sceneSDF(vec3 p) {
      float invWorldScale = clamp(pow(uInvRate, uLevelBase), 1e-12, 1e12);
      float worldScale = 1.0 / invWorldScale;
      vec3 pLocal = uCenterLineA + (p - uCenterLineA) * worldScale;

      float bestDist = 1e9;
      float bestLevel = 0.0;
      for (int j = -DOWN_LEVELS; j <= UP_LEVELS; ++j) {
        float fj = float(j);
        float cubeSize = pow(uInvRate, fj);
        vec3 center = uCenterLineA * (1.0 - cubeSize);
        float dLocal = boxSDF(pLocal - center, vec3(0.5 * cubeSize));
        float d = dLocal * invWorldScale;
        if (d < bestDist) {
          bestDist = d;
          bestLevel = fj + uLevelBase;
        }
      }
      return vec2(bestDist, bestLevel);
    }

    vec3 estimateNormal(vec3 p, float eps) {
      vec2 e = vec2(eps, 0.0);
      return normalize(vec3(
        sceneSDF(p + e.xyy).x - sceneSDF(p - e.xyy).x,
        sceneSDF(p + e.yxy).x - sceneSDF(p - e.yxy).x,
        sceneSDF(p + e.yyx).x - sceneSDF(p - e.yyx).x
      ));
    }

    float softShadow(vec3 ro, vec3 rd, float maxT, float distScale) {
      float res = 1.0;
      float t = 0.02 * distScale;
      float minHit = 0.0007 * distScale;
      float minStep = 0.018 * distScale;
      float maxStep = 0.6 * distScale;
      for (int i = 0; i < MAX_SHADOW_STEPS; ++i) {
        if (t >= maxT) break;
        float h = sceneSDF(ro + rd * t).x;
        if (h < minHit) return 0.0;
        res = min(res, 18.0 * h / max(t, 1e-9 * distScale));
        t += clamp(h, minStep, maxStep);
      }
      return clamp(res, 0.0, 1.0);
    }

    vec3 shade(vec3 ro, vec3 rd, vec3 hitPos, float level, float invWorldScale) {
      vec3 n = estimateNormal(hitPos, EPS * invWorldScale);
      vec3 lightVec = uLightPos - hitPos;
      float lightDist = max(length(lightVec), 0.001);
      vec3 l = lightVec / lightDist;
      float shadow = softShadow(hitPos + n * (0.0045 * invWorldScale), l, lightDist, invWorldScale);

      float diffuse = max(dot(n, l), 0.0);
      vec3 h = normalize(l - rd);
      float spec = pow(max(dot(n, h), 0.0), 20.0) * 0.18;
      float fresnel = pow(1.0 - max(dot(n, -rd), 0.0), 3.0) * 0.18;

      float tint = 0.45 + 0.55 * sin(level * 0.38 + 0.6);
      vec3 matte = mix(uBaseColor * 0.82, uBaseColor * 1.12, tint);

      vec3 ambient = matte * vec3(0.14, 0.17, 0.23);
      vec3 lit = matte * (0.86 * diffuse + 0.1) + vec3(spec + fresnel);
      vec3 color = ambient + lit * shadow;

      float localLightDist = lightDist / max(invWorldScale, 1e-12);
      float fog = exp(-0.008 * localLightDist * localLightDist);
      return mix(uBackground, color, clamp(fog, 0.0, 1.0));
    }

    void main() {
      vec2 uv = vec2(vCoord.x * (uResolution.x / uResolution.y), vCoord.y);
      vec3 rd = normalize(uCameraForward + uv.x * uCameraRight + uv.y * uCameraUp);
      vec3 ro = uCameraPos;
      float invWorldScaleContinuous = clamp(uInvWorldScaleContinuous, 1e-12, 1e12);
      float hitEps = EPS * invWorldScaleContinuous;
      float minStep = 0.001 * invWorldScaleContinuous;
      float maxStep = 1.2 * invWorldScaleContinuous;
      float maxDist = MAX_DIST * invWorldScaleContinuous;

      float travel = 0.0;
      float level = 0.0;
      bool hit = false;
      for (int i = 0; i < MAX_STEPS; ++i) {
        vec3 p = ro + rd * travel;
        vec2 distLevel = sceneSDF(p);
        if (distLevel.x < hitEps) {
          level = distLevel.y;
          hit = true;
          break;
        }
        travel += clamp(distLevel.x, minStep, maxStep);
        if (travel > maxDist) break;
      }

      vec3 color;
      if (hit) {
        vec3 hitPos = ro + rd * travel;
        color = shade(ro, rd, hitPos, level, invWorldScaleContinuous);
      } else {
        float skyMix = 0.5 + 0.5 * rd.y;
        color = mix(uBackground * vec3(0.43, 0.5, 0.66), uBackground * 1.2, skyMix);
      }

      color += 0.012 * sin(vec3(0.0, 1.3, 2.1) + uTime * 0.1 + vCoord.xyx * 9.0);
      gl_FragColor = vec4(pow(max(color, 0.0), vec3(0.92)), 1.0);
    }
  </script>

  <script>
    const RATE_LIMITS = { min: 2, max: 10, step: 0.1 };
    const ZOOM_SPEED_LIMITS = { min: 0.00, max: 1, step: 0.01 };
    const ROTATION_SPEED_LIMITS = { min: 0.00, max: 5, step: 0.01 };
    const CAMERA_ANGLE_LIMITS = { min: -1.5, max: 1.5, step: 0.01 };
    const CAMERA_DISTANCE_LIMITS = { min: 0.8, max: 6, step: 0.1 };
    const AUTO_ZOOM_RATE_LIMITS = { min: 0.00, max: 2, step: 0.01 };
    const LIGHT_YAW_LIMITS = { min: -180, max: 180, step: 1 };
    const LIGHT_PITCH_LIMITS = { min: -89, max: 89, step: 1 };
    const LEVEL_LIMITS = { min: -13, max: 5.5 };

    let R_RATE = 5;
    let ZOOM_SPEED = 0.1;
    let ROTATION_SPEED = 0.5;
    let CAMERA_ANGLE = 0.2;
    let CAMERA_DISTANCE = 2.2;
    let AUTO_ZOOM_RATE = 0.1;
    let LIGHT_YAW = -120;
    let LIGHT_PITCH = 45;
    let AUTO_ZOOM_MODE = 'off';

    const CAMERA_HEIGHT_FACTOR = 0.309;
    const SCROLL_IMPULSE = 0.0018;
    const ZOOM_DAMPING = 5.0;
    const ROTATION_OFFSET = Math.PI * 0.18;
    const AUTO_ZOOM_MODES = ['off', 'in', 'out'];

    function clamp(v, min, max) {
      return Math.min(max, Math.max(min, v));
    }

    function parseFloatParam(value, fallback, limits) {
      if (value === null || value === '') {
        return fallback;
      }
      const parsed = Number(value);
      if (!Number.isFinite(parsed)) {
        return fallback;
      }
      return clamp(parsed, limits.min, limits.max);
    }

    function parseBoolParam(value, fallback) {
      if (value === null) return fallback;
      const normalized = String(value).toLowerCase();
      return !(normalized === '0' || normalized === 'false' || normalized === 'off');
    }

    function parseAutoZoomModeParam(value, fallback) {
      if (value === null || value === '') {
        return fallback;
      }
      const normalized = String(value).toLowerCase();
      if (AUTO_ZOOM_MODES.includes(normalized)) {
        return normalized;
      }
      return fallback;
    }

    function parseConfigFromHash() {
      const hashParams = new URLSearchParams(window.location.hash.slice(1));
      let autoZoomMode = parseAutoZoomModeParam(hashParams.get('autoZoomMode'), AUTO_ZOOM_MODE);
      const parsedStartLevel = Number(hashParams.get('startLevel'));
      if (!hashParams.has('autoZoomMode') && hashParams.has('autoZoom')) {
        autoZoomMode = parseBoolParam(hashParams.get('autoZoom'), false) ? 'in' : 'off';
      }
      return {
        rRate: parseFloatParam(hashParams.get('rRate'), R_RATE, RATE_LIMITS),
        zoomSpeed: parseFloatParam(hashParams.get('zoomSpeed'), ZOOM_SPEED, ZOOM_SPEED_LIMITS),
        cameraAngle: parseFloatParam(hashParams.get('cameraAngle'), CAMERA_ANGLE, CAMERA_ANGLE_LIMITS),
        rotationSpeed: parseFloatParam(hashParams.get('rotationSpeed'), ROTATION_SPEED, ROTATION_SPEED_LIMITS),
        cameraDistance: parseFloatParam(hashParams.get('cameraDistance'), CAMERA_DISTANCE, CAMERA_DISTANCE_LIMITS),
        autoZoomRate: parseFloatParam(hashParams.get('autoZoomRate'), AUTO_ZOOM_RATE, AUTO_ZOOM_RATE_LIMITS),
        lightYaw: parseFloatParam(hashParams.get('lightYaw'), LIGHT_YAW, LIGHT_YAW_LIMITS),
        lightPitch: parseFloatParam(hashParams.get('lightPitch'), LIGHT_PITCH, LIGHT_PITCH_LIMITS),
        autoZoomMode,
        startLevel: Number.isFinite(parsedStartLevel) ? clamp(parsedStartLevel, LEVEL_LIMITS.min, LEVEL_LIMITS.max) : 0
      };
    }

    function formatValue(value, decimals) {
      return Number(value.toFixed(decimals)).toString();
    }

    const canvas = document.getElementById('gl');
    const menu = document.getElementById('menu');
    const returnButton = document.getElementById('return-button');
    const menuToggleButton = document.getElementById('menu-toggle');
    const levelValueEl = document.getElementById('level-value');
    const fpsValueEl = document.getElementById('fps-value');

    const rRateRange = document.getElementById('r-rate-range');
    const rRateNumber = document.getElementById('r-rate-number');
    const zoomSpeedRange = document.getElementById('zoom-speed-range');
    const zoomSpeedNumber = document.getElementById('zoom-speed-number');
    const cameraAngleRange = document.getElementById('camera-angle-range');
    const cameraAngleNumber = document.getElementById('camera-angle-number');
    const rotationSpeedRange = document.getElementById('rotation-speed-range');
    const rotationSpeedNumber = document.getElementById('rotation-speed-number');
    const cameraDistanceRange = document.getElementById('camera-distance-range');
    const cameraDistanceNumber = document.getElementById('camera-distance-number');
    const autoZoomRateRange = document.getElementById('auto-zoom-rate-range');
    const autoZoomRateNumber = document.getElementById('auto-zoom-rate-number');
    const lightYawRange = document.getElementById('light-yaw-range');
    const lightYawNumber = document.getElementById('light-yaw-number');
    const lightPitchRange = document.getElementById('light-pitch-range');
    const lightPitchNumber = document.getElementById('light-pitch-number');
    const autoZoomButton = document.getElementById('auto-zoom-btn');

    const gl = canvas.getContext('webgl', { antialias: false, depth: false, stencil: false, alpha: false }) || canvas.getContext('experimental-webgl');
    if (!gl) {
      throw new Error('WebGL is required to render this scene.');
    }

    function compileShader(type, src) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, src);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    function createProgram(vsSource, fsSource) {
      const program = gl.createProgram();
      gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vsSource));
      gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fsSource));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(program));
      }
      return program;
    }

    const program = createProgram(document.getElementById('vs').textContent, document.getElementById('fs').textContent);
    gl.useProgram(program);

    const quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       1, -1,
      -1,  1,
       1,  1
    ]), gl.STATIC_DRAW);

    const coordLoc = gl.getAttribLocation(program, 'coord');
    gl.enableVertexAttribArray(coordLoc);
    gl.vertexAttribPointer(coordLoc, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {
      resolution: gl.getUniformLocation(program, 'uResolution'),
      cameraPos: gl.getUniformLocation(program, 'uCameraPos'),
      cameraForward: gl.getUniformLocation(program, 'uCameraForward'),
      cameraRight: gl.getUniformLocation(program, 'uCameraRight'),
      cameraUp: gl.getUniformLocation(program, 'uCameraUp'),
      lightPos: gl.getUniformLocation(program, 'uLightPos'),
      centerLineA: gl.getUniformLocation(program, 'uCenterLineA'),
      invRate: gl.getUniformLocation(program, 'uInvRate'),
      levelBase: gl.getUniformLocation(program, 'uLevelBase'),
      invWorldScaleContinuous: gl.getUniformLocation(program, 'uInvWorldScaleContinuous'),
      baseColor: gl.getUniformLocation(program, 'uBaseColor'),
      background: gl.getUniformLocation(program, 'uBackground'),
      time: gl.getUniformLocation(program, 'uTime')
    };

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.floor(canvas.clientWidth * dpr);
      const h = Math.floor(canvas.clientHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      gl.viewport(0, 0, canvas.width, canvas.height);
    }

    function normalize(v) {
      const len = Math.hypot(v[0], v[1], v[2]) || 1;
      return [v[0] / len, v[1] / len, v[2] / len];
    }

    function sub(a, b) {
      return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
    }

    function add(a, b) {
      return [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
    }

    function mul(a, s) {
      return [a[0] * s, a[1] * s, a[2] * s];
    }

    function cross(a, b) {
      return [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0]
      ];
    }

    function safeRate() {
      return Math.max(R_RATE, 1.01);
    }

    function getCenterLineA(rate) {
      const inv = 1 / rate;
      const d = [-0.25, 0.5 + 0.5 * inv, -0.25];
      const scale = rate / (rate - 1);
      return [d[0] * scale, d[1] * scale, d[2] * scale];
    }

    function centerAtRelative(levelRel, invRate, centerA) {
      const size = Math.pow(invRate, levelRel);
      return mul(centerA, 1 - size);
    }

    const hashConfig = parseConfigFromHash();
    R_RATE = hashConfig.rRate;
    ZOOM_SPEED = hashConfig.zoomSpeed;
    CAMERA_ANGLE = hashConfig.cameraAngle;
    ROTATION_SPEED = hashConfig.rotationSpeed;
    CAMERA_DISTANCE = hashConfig.cameraDistance;
    AUTO_ZOOM_RATE = hashConfig.autoZoomRate;
    LIGHT_YAW = hashConfig.lightYaw;
    LIGHT_PITCH = hashConfig.lightPitch;
    AUTO_ZOOM_MODE = hashConfig.autoZoomMode;

    let zoomLevel = hashConfig.startLevel;
    let zoomVelocity = 0;
    let previousTime = 0;
    let smoothedFps = 0;
    let menuVisible = true;

    function writeHash() {
      const hashParams = new URLSearchParams();
      hashParams.set('rRate', formatValue(R_RATE, 2));
      hashParams.set('zoomSpeed', formatValue(ZOOM_SPEED, 2));
      hashParams.set('cameraAngle', formatValue(CAMERA_ANGLE, 2));
      hashParams.set('rotationSpeed', formatValue(ROTATION_SPEED, 2));
      hashParams.set('cameraDistance', formatValue(CAMERA_DISTANCE, 2));
      hashParams.set('autoZoomRate', formatValue(AUTO_ZOOM_RATE, 2));
      hashParams.set('lightYaw', formatValue(LIGHT_YAW, 2));
      hashParams.set('lightPitch', formatValue(LIGHT_PITCH, 2));
      hashParams.set('autoZoomMode', AUTO_ZOOM_MODE);
      if (Math.abs(zoomLevel) > 0.0001) {
        hashParams.set('startLevel', formatValue(zoomLevel, 2));
      }
      const nextHash = hashParams.toString();
      if (window.location.hash.slice(1) !== nextHash) {
        history.replaceState(null, '', `${window.location.pathname}${window.location.search}#${nextHash}`);
      }
    }

    function setAutoZoomButton() {
      autoZoomButton.classList.remove('in', 'out');
      if (AUTO_ZOOM_MODE !== 'off') {
        autoZoomButton.classList.add(AUTO_ZOOM_MODE);
      }
      autoZoomButton.setAttribute('aria-pressed', AUTO_ZOOM_MODE === 'off' ? 'false' : 'true');
      const autoZoomText = AUTO_ZOOM_MODE === 'in' ? 'OUT' : (AUTO_ZOOM_MODE === 'out' ? 'IN' : 'OFF');
      autoZoomButton.textContent = `Auto zoom: ${autoZoomText}`;
    }

    function syncUiFromState() {
      rRateRange.value = String(R_RATE);
      rRateNumber.value = formatValue(R_RATE, 2);
      zoomSpeedRange.value = String(ZOOM_SPEED);
      zoomSpeedNumber.value = formatValue(ZOOM_SPEED, 2);
      cameraAngleRange.value = String(CAMERA_ANGLE);
      cameraAngleNumber.value = formatValue(CAMERA_ANGLE, 2);
      rotationSpeedRange.value = String(ROTATION_SPEED);
      rotationSpeedNumber.value = formatValue(ROTATION_SPEED, 2);
      cameraDistanceRange.value = String(CAMERA_DISTANCE);
      cameraDistanceNumber.value = formatValue(CAMERA_DISTANCE, 2);
      autoZoomRateRange.value = String(AUTO_ZOOM_RATE);
      autoZoomRateNumber.value = formatValue(AUTO_ZOOM_RATE, 2);
      lightYawRange.value = String(LIGHT_YAW);
      lightYawNumber.value = formatValue(LIGHT_YAW, 2);
      lightPitchRange.value = String(LIGHT_PITCH);
      lightPitchNumber.value = formatValue(LIGHT_PITCH, 2);
      setAutoZoomButton();
    }

    function toRadians(deg) {
      return deg * Math.PI / 180;
    }

    function applyValueFromInput(inputValue, limits) {
      return clamp(Number(inputValue), limits.min, limits.max);
    }

    function bindSyncedControl(rangeInput, numberInput, limits, onChange) {
      const apply = (rawValue) => {
        const parsed = Number(rawValue);
        if (!Number.isFinite(parsed)) {
          return;
        }
        const value = applyValueFromInput(parsed, limits);
        rangeInput.value = String(value);
        numberInput.value = formatValue(value, 2);
        onChange(value);
      };

      rangeInput.addEventListener('input', (event) => apply(event.target.value));
      numberInput.addEventListener('input', (event) => apply(event.target.value));
      numberInput.addEventListener('change', (event) => apply(event.target.value));
    }

    bindSyncedControl(rRateRange, rRateNumber, RATE_LIMITS, (value) => {
      R_RATE = value;
      writeHash();
    });

    bindSyncedControl(zoomSpeedRange, zoomSpeedNumber, ZOOM_SPEED_LIMITS, (value) => {
      ZOOM_SPEED = value;
      writeHash();
    });

    bindSyncedControl(cameraAngleRange, cameraAngleNumber, CAMERA_ANGLE_LIMITS, (value) => {
      CAMERA_ANGLE = value;
      writeHash();
    });

    bindSyncedControl(rotationSpeedRange, rotationSpeedNumber, ROTATION_SPEED_LIMITS, (value) => {
      ROTATION_SPEED = value;
      writeHash();
    });

    bindSyncedControl(cameraDistanceRange, cameraDistanceNumber, CAMERA_DISTANCE_LIMITS, (value) => {
      CAMERA_DISTANCE = value;
      writeHash();
    });

    bindSyncedControl(autoZoomRateRange, autoZoomRateNumber, AUTO_ZOOM_RATE_LIMITS, (value) => {
      AUTO_ZOOM_RATE = value;
      writeHash();
    });

    bindSyncedControl(lightYawRange, lightYawNumber, LIGHT_YAW_LIMITS, (value) => {
      LIGHT_YAW = value;
      writeHash();
    });

    bindSyncedControl(lightPitchRange, lightPitchNumber, LIGHT_PITCH_LIMITS, (value) => {
      LIGHT_PITCH = value;
      writeHash();
    });

    autoZoomButton.addEventListener('click', () => {
      const modeIndex = AUTO_ZOOM_MODES.indexOf(AUTO_ZOOM_MODE);
      const nextIndex = (modeIndex + 1) % AUTO_ZOOM_MODES.length;
      AUTO_ZOOM_MODE = AUTO_ZOOM_MODES[nextIndex];
      setAutoZoomButton();
      writeHash();
    });

    function setMenuVisible(visible) {
      menuVisible = visible;
      menu.style.display = menuVisible ? 'block' : 'none';
      returnButton.style.display = menuVisible ? 'inline-block' : 'none';
      menuToggleButton.textContent = menuVisible ? 'Hide menu (Esc)' : 'Show menu (Esc)';
    }

    menuToggleButton.addEventListener('click', () => {
      setMenuVisible(!menuVisible);
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        event.preventDefault();
        setMenuVisible(!menuVisible);
      }
    });

    window.addEventListener('hashchange', () => {
      const nextConfig = parseConfigFromHash();
      R_RATE = nextConfig.rRate;
      ZOOM_SPEED = nextConfig.zoomSpeed;
      CAMERA_ANGLE = nextConfig.cameraAngle;
      ROTATION_SPEED = nextConfig.rotationSpeed;
      CAMERA_DISTANCE = nextConfig.cameraDistance;
      AUTO_ZOOM_RATE = nextConfig.autoZoomRate;
      LIGHT_YAW = nextConfig.lightYaw;
      LIGHT_PITCH = nextConfig.lightPitch;
      AUTO_ZOOM_MODE = nextConfig.autoZoomMode;
      if (Number.isFinite(nextConfig.startLevel)) {
        zoomLevel = nextConfig.startLevel;
        zoomVelocity = 0;
      }
      syncUiFromState();
    });

    window.addEventListener('resize', resize);
    window.addEventListener('wheel', (event) => {
      event.preventDefault();
      zoomVelocity += (-event.deltaY) * SCROLL_IMPULSE * ZOOM_SPEED;
    }, { passive: false });

    function render(timeMs) {
      resize();

      const time = timeMs * 0.001;
      const dt = Math.min(0.05, Math.max(0.001, time - previousTime || 0.016));
      previousTime = time;

      const fps = 1 / dt;
      smoothedFps = smoothedFps === 0 ? fps : (smoothedFps * 0.92 + fps * 0.08);

      if (AUTO_ZOOM_MODE === 'in') {
        zoomVelocity += -AUTO_ZOOM_RATE * ZOOM_SPEED * dt;
      } else if (AUTO_ZOOM_MODE === 'out') {
        zoomVelocity += AUTO_ZOOM_RATE * ZOOM_SPEED * dt;
      }

      if (zoomLevel <= LEVEL_LIMITS.min && zoomVelocity < 0) {
        zoomVelocity = 0;
      } else if (zoomLevel >= LEVEL_LIMITS.max && zoomVelocity > 0) {
        zoomVelocity = 0;
      }

      zoomVelocity *= Math.exp(-ZOOM_DAMPING * dt);
      zoomLevel += zoomVelocity * dt * 60.0;

      if (zoomLevel < LEVEL_LIMITS.min) {
        zoomLevel = LEVEL_LIMITS.min;
        if (zoomVelocity < 0) {
          zoomVelocity = 0;
        }
      } else if (zoomLevel > LEVEL_LIMITS.max) {
        zoomLevel = LEVEL_LIMITS.max;
        if (zoomVelocity > 0) {
          zoomVelocity = 0;
        }
      }

      const rate = safeRate();
      const invRate = 1 / rate;
      const centerA = getCenterLineA(rate);

      const baseLevel = Math.floor(zoomLevel);
      const zoomScale = Math.pow(invRate, zoomLevel);

      const target = centerAtRelative(zoomLevel, invRate, centerA);
      const angle = -Math.PI * 2 * ROTATION_SPEED * zoomLevel + ROTATION_OFFSET;

      const camRadius = CAMERA_DISTANCE * zoomScale;
      const camHeight = CAMERA_DISTANCE * CAMERA_HEIGHT_FACTOR * zoomScale;
      const camPos = [
        target[0] + Math.cos(angle) * camRadius,
        target[1] + camHeight + 0.18 * zoomScale * Math.sin(angle * 0.7),
        target[2] + Math.sin(angle) * camRadius
      ];

      const lookTarget = [target[0], target[1] + CAMERA_ANGLE * zoomScale, target[2]];
      const forward = normalize(sub(lookTarget, camPos));
      let right = normalize(cross(forward, [0, 1, 0]));
      if (Math.hypot(right[0], right[1], right[2]) < 0.0001) {
        right = [1, 0, 0];
      }
      const up = normalize(cross(right, forward));

      const lightYawRad = toRadians(LIGHT_YAW);
      const lightPitchRad = toRadians(LIGHT_PITCH);
      const lightDir = [
        Math.cos(lightPitchRad) * Math.cos(lightYawRad),
        Math.sin(lightPitchRad),
        Math.cos(lightPitchRad) * Math.sin(lightYawRad)
      ];
      const lightPos = add(target, mul(lightDir, 5.1 * zoomScale));

      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
      gl.uniform3f(uniforms.cameraPos, camPos[0], camPos[1], camPos[2]);
      gl.uniform3f(uniforms.cameraForward, forward[0], forward[1], forward[2]);
      gl.uniform3f(uniforms.cameraRight, right[0], right[1], right[2]);
      gl.uniform3f(uniforms.cameraUp, up[0], up[1], up[2]);
      gl.uniform3f(uniforms.lightPos, lightPos[0], lightPos[1], lightPos[2]);
      gl.uniform3f(uniforms.centerLineA, centerA[0], centerA[1], centerA[2]);
      gl.uniform1f(uniforms.invRate, invRate);
      gl.uniform1f(uniforms.levelBase, baseLevel);
      gl.uniform1f(uniforms.invWorldScaleContinuous, zoomScale);
      gl.uniform3f(uniforms.baseColor, 0.84, 0.88, 0.94);
      gl.uniform3f(uniforms.background, 0.07, 0.11, 0.18);
      gl.uniform1f(uniforms.time, time);

      levelValueEl.textContent = zoomLevel.toFixed(2);
      fpsValueEl.textContent = smoothedFps.toFixed(1);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(render);
    }

    syncUiFromState();
    setMenuVisible(true);
    writeHash();
    resize();
    requestAnimationFrame(render);
  </script>
</body>
</html>
